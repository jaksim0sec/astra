<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
  >

  <meta
    name="theme-color"
    content="#101010"
  >
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ovll">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pwa-192.png">

  <title>ovll</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
  >

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/node.css">
  <link rel="stylesheet" href="./css/chat.css">
  <link rel="stylesheet" href="./css/shellMenu.css">
</head>

<body>

  <div id="app">
    <div id="app-stage">

    <!-- Fixed UI -->
    <header id="topbar">
      <div id="topbar-left"></div>

      <div
        id="mode-switch"
        role="tablist"
        aria-label="화면 모드"
      >
        <button
          id="mode-chat"
          type="button"
          role="tab"
          aria-selected="true"
          data-mode="chat"
        >
          채팅
        </button>

        <button
          id="mode-canvas"
          type="button"
          role="tab"
          aria-selected="false"
          data-mode="canvas"
        >
          캔버스
        </button>
      </div>

      <div id="topbar-right"></div>
    </header>


    <!-- Main workspace -->
    <main id="workspace">

      <!-- Chat page -->
      <section
        id="chat-page"
        class="page"
        data-page="chat"
        aria-label="채팅"
      >
        <div id="chat-content">
          <div id="chat-messages"></div>
        </div>
      </section>


      <!-- Canvas page -->
      <section
        id="canvas-page"
        class="page"
        data-page="canvas"
        aria-label="캔버스"
      >
        <div id="canvas-viewport">
          <div id="canvas-world">
            <svg
              id="canvas-connections"
              aria-hidden="true"
            ></svg>

            <div id="canvas-nodes"></div>
          </div>
        </div>
      </section>

    </main>


    <!-- Fixed composer -->
    <footer id="composer">
      <form id="composer-form">

        <input
          id="composer-file-input"
          type="file"
          hidden
        />

        <button
          id="composer-attach"
          type="button"
          aria-label="파일 추가"
          title="파일 추가"
        >
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4v12M4 10h12"></path>
          </svg>
        </button>

        <textarea
          id="composer-input"
          name="message"
          rows="1"
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
          placeholder="무엇을 할까요?"
        ></textarea>

        <button
          id="composer-submit"
          type="submit"
          aria-label="전송"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <path d="M5.5 9.25 10 4.75l4.5 4.5"></path>
            <path d="M10 5v10.25"></path>
          </svg>
        </button>

      </form>
    </footer>

    </div>
  </div>


  <!-- Version guard + application bootstrap -->
  <script src="./js/boot.js"></script>

</body>
</html>
