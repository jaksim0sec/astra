<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Astra</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/node.css">
  <link rel="stylesheet" href="./css/chat.css">
</head>

<body>

  <div id="app">

    <!-- Fixed UI -->
    <header id="topbar">
      <div id="topbar-left"></div>

      <div
        id="mode-switch"
        role="tablist"
        aria-label="화면 모드"
      >
        <button
          id="mode-chat"
          type="button"
          role="tab"
          aria-selected="true"
          data-mode="chat"
        >
          Chat
        </button>

        <button
          id="mode-canvas"
          type="button"
          role="tab"
          aria-selected="false"
          data-mode="canvas"
        >
          Canvas
        </button>
      </div>

      <div id="topbar-right"></div>
    </header>


    <!-- Main workspace -->
    <main id="workspace">

      <!-- Chat page -->
      <section
        id="chat-page"
        class="page"
        data-page="chat"
        aria-label="Chat"
      >
        <div id="chat-content">
          <div id="chat-messages"></div>
        </div>
      </section>


      <!-- Canvas page -->
      <section
        id="canvas-page"
        class="page"
        data-page="canvas"
        aria-label="Canvas"
      >
        <div id="canvas-viewport">
          <div id="canvas-world">
            <svg
              id="canvas-connections"
              aria-hidden="true"
            ></svg>

            <div id="canvas-nodes"></div>
          </div>
        </div>
      </section>

    </main>


    <!-- Fixed composer -->
    <footer id="composer">
      <form id="composer-form">

        <textarea
          id="composer-input"
          name="message"
          rows="1"
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
          placeholder="무엇을 할까요?"
        ></textarea>

        <button
          id="composer-submit"
          type="submit"
          aria-label="전송"
        >
          ↑
        </button>

      </form>
    </footer>

  </div>


  <!-- Common utilities -->
  <script src="./js/functions.js"></script>

  <!-- API -->
  <script src="./js/api.js"></script>

  <!-- Canvas / Node engine -->
  <script src="./js/canvasNode.js"></script>

  <!-- UI -->
  <script src="./js/ui.js"></script>

  <!-- Application entry -->
  <script src="./js/app.js"></script>

</body>
</html>
