<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<title>Astra 아스트라</title>
<link rel="stylesheet" href="/style.css">
<script src="/functions.js"></script>
</head>

<body>

<div id="app"></div>

<script>
(function(){
  'use strict';

  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const distance=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
  const midpoint=(a,b)=>({
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  });

  const svgNS='http://www.w3.org/2000/svg';

  let instanceSeq=0;


  /* =========================
     UI-only Icons
     
     Node Definition의 일부가 아니라
     캔버스 UI 전용 아이콘이다.
  ========================= */

  const deleteIcon=`
    <svg viewBox="0 0 20 20" fill="none">
      <path
        d="M5.5 6.5h9
           M8 6.5V5h4v1.5
           M7 8.5v6.5h6V8.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M9 9.5v3.5M11 9.5v3.5"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linecap="round"
      />
    </svg>
  `;

  const toggleIcon=`
    <svg viewBox="0 0 20 20" fill="none">
      <path
        d="M6 8l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  `;

  const attachIcon=`
    <svg viewBox="0 0 20 20" fill="none">
      <path
        d="M7.2 10.8
           l4.7-4.7
           a2.55 2.55 0 0 1 3.6 3.6
           l-5.9 5.9
           a4.05 4.05 0 0 1-5.7-5.7
           l6-6"
        stroke="currentColor"
        stroke-width="1.55"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  `;

  const sendIcon=`
    <svg viewBox="0 0 20 20" fill="none">
      <path
        d="M10 15.5V4.5
           M5.8 8.7L10 4.5L14.2 8.7"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  `;

  const addIcon=`
    <svg
      class="vc-add-node-icon"
      viewBox="0 0 20 20"
      fill="none"
    >
      <path
        d="M10 4V16M4 10H16"
        stroke="currentColor"
        stroke-width="1.55"
        stroke-linecap="round"
      />
    </svg>
  `;


  /* =========================
     Canonical Definition Loader
  ========================= */

  async function loadNodeDefinitions(){

    if(
      window.nodeDefinitions &&
      typeof window.nodeDefinitions==='object' &&
      !Array.isArray(window.nodeDefinitions) &&
      Object.keys(window.nodeDefinitions).length
    ){

      return window.nodeDefinitions;

    }


    const response=
      await fetch(
        '/api/node-definitions',
        {
          method:'GET',
          headers:{
            Accept:'application/json'
          }
        }
      );


    if(!response.ok){

      throw new Error(
        `노드 정의를 불러오지 못했습니다. HTTP ${response.status}`
      );

    }


    const result=
      await response.json();


    if(
      !result||
      result.ok===false||
      !result.nodes||
      typeof result.nodes!=='object'||
      Array.isArray(result.nodes)
    ){

      throw new Error(
        '노드 정의 응답이 올바르지 않습니다.'
      );

    }


    window.nodeDefinitions=
      result.nodes;


    return result.nodes;
  }


  /* =========================
     Client Renderers
     
     Definition 자체를 변경하지 않고
     frontend가 표현만 담당한다.
  ========================= */

  const clientNodeRenderers={

    file(node){

      const mime=
        node.data?.mime||
        '알 수 없는 형식';

      const size=
        Number(
          node.data?.size||
          0
        );

      const sizeText=
        size<1024
          ?`${size} B`
          :size<1024*1024
            ?`${(size/1024).toFixed(1)} KB`
            :`${(size/1024/1024).toFixed(1)} MB`;

      return `
        <div class="vc-file-meta">
          <span>${escapeHtml(mime)}</span>
          <span>${escapeHtml(sizeText)}</span>
        </div>
      `;

    }

  };


  /* =========================
     Visual Canvas
  ========================= */

  window.createVisualCanvas=
    function(
      target,
      options={}
    ){

      if(
        !(target instanceof Element)
      ){

        throw new TypeError(
          'target must be a DOM Element'
        );

      }


      const uid=
        `vc-${++instanceSeq}-${Math.random().toString(36).slice(2,7)}`;


      const state={

        nodes:[],

        connections:[],

        selectedNode:null,

        scale:1,

        offset:{
          x:0,
          y:0
        },

        pointers:new Map(),

        nodeDrag:null,

        canvasPan:null,

        pinch:null,

        connectionDrag:null,

        expansionAnimation:null,

        rafIds:new Set(),

        destroyed:false,

        addMenuOpen:false,

        validationTimer:null,

        aiBusy:false

      };


      /*
        서버에서 받은 Canonical Definition만 사용한다.
      */
      const definitions=
        options.nodeDefinitions||
        {};

      const registry=
        new Map(
          Object.entries(
            definitions
          ).map(
            ([type,definition])=>[
              type,
              normalizeNodeType(
                type,
                definition
              )
            ]
          )
        );


      const events=
        new Map();

      const listeners=[];

      const observerHandles=[];


      const nodeResizeObserver=
        new ResizeObserver(
          entries=>{

            for(
              const entry of entries
            ){

              const el=
                entry.target;

              const n=
                getNode(
                  el.dataset.nodeId
                );

              if(n){

                positionPorts(
                  el,
                  getNodeType(n)
                );

              }

            }

            renderConnections();

          }
        );


      const root=
        document.createElement('div');

      root.className=
        'vc-root';

      root.dataset.vcInstance=
        uid;


      root.innerHTML=`
        <div class="vc-canvas">

          <div class="vc-world">

            <svg
              class="vc-svg"
              viewBox="0 0 3000 3000"
              preserveAspectRatio="none"
            >

              <defs>

                <marker
                  class="vc-arrow-marker"
                  viewBox="0 0 10 10"
                  refX="8"
                  refY="5"
                  markerWidth="5"
                  markerHeight="5"
                  orient="auto"
                >
                  <path
                    d="M1 1L8 5L1 9"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  ></path>
                </marker>

              </defs>

              <g class="vc-connection-layer"></g>

              <g class="vc-drag-connection-layer"></g>

            </svg>

            <div class="vc-nodes"></div>

          </div>

        </div>

        <div class="vc-zoom-indicator">
          100%
        </div>

        <div class="vc-validation"></div>

        <div class="vc-top-controls">

          <button
            type="button"
            class="vc-top-button vc-theme-button"
            aria-label="다크 모드"
          >
            ◐
          </button>

          <button
            type="button"
            class="vc-top-button vc-add-button"
            aria-label="노드 추가"
            aria-expanded="false"
          >
            ${addIcon}
          </button>

        </div>

        <div class="vc-add-menu"></div>

        <div class="vc-composer-wrap">

          <form class="vc-composer">

            <button
              type="button"
              class="vc-composer-button vc-attach-button"
              aria-label="파일 추가"
            >
              ${attachIcon}
            </button>

            <textarea
              rows="1"
              class="vc-chat-input"
              placeholder="무엇을 만들까요?"
            ></textarea>

            <button
              type="submit"
              class="vc-composer-button vc-send-button"
              aria-label="보내기"
            >
              ${sendIcon}
            </button>

          </form>

          <input
            class="vc-file-input"
            type="file"
            multiple
            hidden
          >

        </div>
      `;


      target.appendChild(root);


      if(
        !document.getElementById(
          'vc-ai-wait-style'
        )
      ){

        const style=
          document.createElement('style');

        style.id=
          'vc-ai-wait-style';

        style.textContent=`

          .vc-composer.vc-ai-busy{
            cursor:wait;
          }

          .vc-composer.vc-ai-busy
          .vc-chat-input{
            opacity:.62;
          }

          .vc-composer.vc-ai-busy
          .vc-composer-button{
            cursor:wait;
          }

          .vc-composer-button:disabled{
            opacity:.55;
          }

          .vc-ai-spinner{
            display:block;
            width:15px;
            height:15px;
            border:1.7px solid currentColor;
            border-right-color:transparent;
            border-radius:50%;
            animation:vc-ai-spin .72s linear infinite;
          }

          @keyframes vc-ai-spin{
            to{
              transform:rotate(360deg)
            }
          }

        `;

        document.head.appendChild(
          style
        );

      }


      const qs=
        selector=>
          root.querySelector(
            selector
          );


      const canvas=
        qs(
          '.vc-canvas'
        );

      const world=
        qs(
          '.vc-world'
        );

      const nodesLayer=
        qs(
          '.vc-nodes'
        );

      const connectionLayer=
        qs(
          '.vc-connection-layer'
        );

      const dragConnectionLayer=
        qs(
          '.vc-drag-connection-layer'
        );

      const zoomIndicator=
        qs(
          '.vc-zoom-indicator'
        );

      const validationLayer=
        qs(
          '.vc-validation'
        );

      const addButton=
        qs(
          '.vc-add-button'
        );

      const addMenu=
        qs(
          '.vc-add-menu'
        );

      const themeButton=
        qs(
          '.vc-theme-button'
        );

      const chatForm=
        qs(
          '.vc-composer'
        );

      const chatInput=
        qs(
          '.vc-chat-input'
        );

      const attachButton=
        qs(
          '.vc-attach-button'
        );

      const fileInput=
        qs(
          '.vc-file-input'
        );


      const markerId=
        `${uid}-arrow`;


      qs(
        '.vc-arrow-marker'
      ).setAttribute(
        'id',
        markerId
      );


      /* =========================
         Event System
      ========================= */

      function on(
        event,
        handler
      ){

        if(
          typeof handler!=='function'
        ){

          return ()=>{};

        }


        if(
          !events.has(event)
        ){

          events.set(
            event,
            new Set()
          );

        }


        events.get(event).add(
          handler
        );


        return ()=>{
          off(
            event,
            handler
          );
        };

      }


      function off(
        event,
        handler
      ){

        events
          .get(event)
          ?.delete(handler);

      }


      function emit(
        event,
        payload
      ){

        for(
          const fn of
          events.get(event)||[]
        ){

          try{

            fn(
              payload,
              api
            );

          }catch(error){

            console.error(
              error
            );

          }

        }

      }


      function listen(
        el,
        type,
        fn,
        opts
      ){

        el.addEventListener(
          type,
          fn,
          opts
        );

        listeners.push(
          ()=>{
            el.removeEventListener(
              type,
              fn,
              opts
            );
          }
        );

      }


      function raf(
        fn
      ){

        const id=
          requestAnimationFrame(
            t=>{

              state.rafIds.delete(
                id
              );

              if(
                !state.destroyed
              ){

                fn(t);

              }

            }
          );

        state.rafIds.add(
          id
        );

        return id;

      }


      /* =========================
         Basic Helpers
      ========================= */

      function getNode(
        id
      ){

        return state.nodes.find(
          n=>n.id===id
        )||null;

      }


      function getNodeElement(
        id
      ){

        return nodesLayer.querySelector(
          `.vc-node[data-node-id="${CSS.escape(String(id))}"]`
        );

      }


      function getNodeType(
        node
      ){

        return node
          ?registry.get(node.type)||null
          :null;

      }


      function screenToWorld(
        x,
        y
      ){

        return {

          x:
            (x-state.offset.x)/
            state.scale,

          y:
            (y-state.offset.y)/
            state.scale

        };

      }


      function renderTransform(){

        world.style.transform=
          `translate(${state.offset.x}px,${state.offset.y}px) scale(${state.scale})`;

        zoomIndicator.textContent=
          `${Math.round(state.scale*100)}%`;

      }


      function svgEl(
        name,
        attrs={}
      ){

        const element=
          document.createElementNS(
            svgNS,
            name
          );

        for(
          const [key,value]
            of Object.entries(attrs)
        ){

          element.setAttribute(
            key,
            value
          );

        }

        return element;

      }


      function connectionKey(
        connection
      ){

        return `
          ${connection.from.node}
          :
          ${connection.from.port}
          ->
          ${connection.to.node}
          :
          ${connection.to.port}
        `.replace(
          /\s+/g,
          ''
        );

      }


      function portDef(
        nodeId,
        portId,
        direction
      ){

        const node=
          getNode(
            nodeId
          );

        const type=
          getNodeType(
            node
          );

        if(
          !node||
          !type
        ){

          return null;

        }


        const ports=
          direction==='input'
            ?(
              Array.isArray(type.inputs)
                ?type.inputs
                :[]
            )
            :(
              Array.isArray(type.outputs)
                ?type.outputs
                :[]
            );


        return ports.find(
          port=>
            port.id===portId
        )||null;

      }


      function portEl(
        nodeId,
        portId,
        direction
      ){

        return nodesLayer.querySelector(
          `.vc-port-hit[data-node-id="${CSS.escape(String(nodeId))}"][data-port-id="${CSS.escape(String(portId))}"][data-port-dir="${direction}"]`
        );

      }


      function portPoint(
        nodeId,
        portId,
        direction
      ){

        const element=
          portEl(
            nodeId,
            portId,
            direction
          );

        if(!element){

          return null;

        }


        const anchor=
          element.querySelector(
            '.vc-port-anchor'
          )||
          element;


        const rect=
          anchor.getBoundingClientRect();

        const canvasRect=
          canvas.getBoundingClientRect();


        return {

          x:
            (
              rect.left+
              rect.width/2-
              canvasRect.left-
              state.offset.x
            )/
            state.scale,

          y:
            (
              rect.top+
              rect.height/2-
              canvasRect.top-
              state.offset.y
            )/
            state.scale

        };

      }


      function curve(
        a,
        b
      ){

        const dx=
          b.x-a.x;

        const bend=
          clamp(
            Math.abs(dx)*.22+
            Math.abs(b.y-a.y)*.05,
            28,
            85
          );


        return `
          M ${a.x} ${a.y}
          C
            ${a.x+bend} ${a.y},
            ${b.x-bend} ${b.y},
            ${b.x} ${b.y}
        `.replace(
          /\s+/g,
          ' '
        );

      }


      /* =========================
         Definition Normalization
      ========================= */

      function normalizePort(
        port,
        index,
        direction
      ){

        const p={
          ...port
        };

        p.id=
          String(
            p.id||
            `${direction}-${index}`
          );

        p.name=
          p.name??
          p.id;

        p.type=
          p.type||
          'any';

        p.required=
          !!p.required;

        p.multiple=
          p.multiple!==false;

        p.accepts=
          Array.isArray(p.accepts)&&
          p.accepts.length
            ?p.accepts.slice()
            :['any'];

        return p;

      }


      function normalizeNodeType(
        type,
        definition
      ){

        const d={
          ...(
            definition||
            {}
          )
        };

        d.inputs=
          (
            d.inputs||
            []
          ).map(
            (port,index)=>
              normalizePort(
                port,
                index,
                'input'
              )
          );

        d.outputs=
          (
            d.outputs||
            []
          ).map(
            (port,index)=>
              normalizePort(
                port,
                index,
                'output'
              )
          );

        d.params=
          Array.isArray(d.params)
            ?d.params
            :[];

        d.slots={
          description:true,
          param:true,
          body:true,
          footer:true,
          ...(d.slots||{})
        };

        d.tag=
          d.tag||
          type.toUpperCase();

        d.color=
          d.color||
          '#888';

        d.icon=
          typeof d.icon==='string'
            ?d.icon
            :'';

        return d;

      }


      /* =========================
         Node Body Rendering
      ========================= */

      function renderSlotContent(
        node,
        type
      ){

        const body=[];


        if(
          type.slots.description!==false&&
          (
            type.desc||
            type.description
          )
        ){

          body.push(`
            <div class="vc-slot-description">
              ${escapeHtml(
                type.desc||
                type.description||
                ''
              )}
            </div>
          `);

        }


        if(
          type.slots.param!==false&&
          Array.isArray(
            type.params
          )
        ){

          const values=
            node.data?.params||
            {};


          for(
            const param of type.params
          ){

            const value=
              values[param.id]??
              '';


            body.push(`
              <div class="vc-param-group">

                <label
                  class="vc-param-label"
                >
                  ${escapeHtml(
                    param.name||
                    param.id
                  )}
                </label>

                <input
                  class="vc-slot-param"
                  type="text"
                  data-param-id="${escapeHtml(
                    param.id
                  )}"
                  value="${escapeHtml(
                    value
                  )}"
                  placeholder="${escapeHtml(
                    param.placeholder||
                    ''
                  )}"
                >

              </div>
            `);

          }

        }


        /*
          Renderer implementation은 frontend에만 둔다.
          Node Definition 자체에는 JS function을 넣지 않는다.
        */
        const renderer=
          clientNodeRenderers[
            node.type
          ];


        if(
          typeof renderer==='function'
        ){

          const custom=
            renderer(
              node,
              {
                node,
                type,
                instance:api
              }
            );


          if(
            custom instanceof Node
          ){

            body.push(
              custom.outerHTML
            );

          }else if(
            typeof custom==='string'
          ){

            body.push(
              `<div class="vc-slot-custom">${custom}</div>`
            );

          }

        }


        if(
          type.slots.footer!==false&&
          type.footer
        ){

          if(
            typeof type.footer==='function'
          ){

            body.push(`
              <div class="vc-slot-custom">
                ${
                  type.footer(
                    node,
                    {
                      node,
                      type,
                      instance:api
                    }
                  )||''
                }
              </div>
            `);

          }else{

            body.push(`
              <div class="vc-slot-custom">
                ${type.footer}
              </div>
            `);

          }

        }


        return body.join('');

      }


      function escapeHtml(
        value
      ){

        return String(
          value
        ).replace(
          /[&<>'"]/g,
          character=>({

            '&':'&amp;',

            '<':'&lt;',

            '>':'&gt;',

            "'":'&#39;',

            '"':'&quot;'

          })[character]
        );

      }


      /* =========================
         Node Rendering
      ========================= */

      function renderNodes(){

        nodesLayer.textContent='';


        for(
          const node of state.nodes
        ){

          const type=
            getNodeType(
              node
            );


          if(!type){

            continue;

          }


          const element=
            document.createElement(
              'div'
            );


          const isImageFile=
            node.type==='file'&&
            node.data?.mime?.startsWith(
              'image/'
            );


          element.className=
            `vc-node`+
            `${
              node.type==='start'
                ?' vc-start-node'
                :''
            }`+
            `${
              node.type==='file'
                ?' vc-file-node'
                :''
            }`+
            `${
              isImageFile
                ?' vc-image-file-node'
                :''
            }`;


          if(
            isImageFile&&
            node.data?.previewUrl
          ){

            element.style.setProperty(
              '--vc-file-bg',
              `url("${node.data.previewUrl}")`
            );

          }


          if(
            node.id===
            state.selectedNode
          ){

            element.classList.add(
              'vc-selected'
            );

          }


          if(
            node.expanded
          ){

            element.classList.add(
              'vc-expanded'
            );

          }


          element.dataset.nodeId=
            node.id;


          element.style.left=
            `${node.x}px`;

          element.style.top=
            `${node.y}px`;

          element.style.setProperty(
            '--node-color',
            type.color
          );


          const fileName=
            node.type==='file'
              ?(
                node.data?.name||
                '이름 없는 파일'
              )
              :type.name;


          const fileExt=
            node.type==='file'&&
            fileName.includes('.')
              ?fileName
                .split('.')
                .pop()
                .toUpperCase()
              :'FILE';


          const icon=
            type.icon||
            '';


          element.innerHTML=`

            <div class="vc-node-head">

              <span class="vc-node-icon">
                ${icon}
              </span>

              ${
                node.type==='file'
                  ?`
                    <span class="vc-file-title-wrap">

                      <span
                        class="vc-file-title"
                        title="${escapeHtml(
                          fileName
                        )}"
                      >
                        ${escapeHtml(
                          fileName
                        )}
                      </span>

                      <span class="vc-file-type">
                        ${escapeHtml(
                          fileExt
                        )}
                      </span>

                    </span>
                  `
                  :`
                    <span class="vc-node-title">
                      ${escapeHtml(
                        type.name||
                        node.type
                      )}
                    </span>
                  `
              }

              ${
                node.type==='start'
                  ?`
                    <span class="vc-start-badge">
                      START
                    </span>
                  `
                  :''
              }

              <div class="vc-node-actions">

                ${
                  node.type!=='start'
                    ?`
                      <button
                        type="button"
                        class="vc-node-action vc-node-delete"
                        data-action="delete"
                        aria-label="노드 삭제"
                      >
                        ${deleteIcon}
                      </button>
                    `
                    :''
                }

                <button
                  type="button"
                  class="vc-node-action vc-node-toggle"
                  data-action="toggle"
                  aria-label="상세 내용 열기"
                  aria-expanded="${!!node.expanded}"
                >
                  ${toggleIcon}
                </button>

              </div>

            </div>

            <div class="vc-node-body">
              ${renderSlotContent(
                node,
                type
              )}
            </div>

            ${
              type.inputs
                .map(
                  port=>`
                    <div
                      class="vc-port-hit vc-input"
                      data-port-dir="input"
                      data-port-id="${escapeHtml(
                        port.id
                      )}"
                      data-node-id="${escapeHtml(
                        node.id
                      )}"
                    >

                      <span class="vc-port-anchor">
                        <span class="vc-port-pill"></span>
                      </span>

                      <span class="vc-port-label">
                        ${escapeHtml(
                          port.name
                        )}
                      </span>

                    </div>
                  `
                )
                .join('')
            }

            ${
              type.outputs
                .map(
                  port=>`
                    <div
                      class="vc-port-hit vc-output"
                      data-port-dir="output"
                      data-port-id="${escapeHtml(
                        port.id
                      )}"
                      data-node-id="${escapeHtml(
                        node.id
                      )}"
                    >

                      <span class="vc-port-anchor">
                        <span class="vc-port-pill"></span>
                      </span>

                      <span class="vc-port-label">
                        ${escapeHtml(
                          port.name
                        )}
                      </span>

                    </div>
                  `
                )
                .join('')
            }

          `;


          nodesLayer.appendChild(
            element
          );


          const paramInputs=
            element.querySelectorAll(
              '.vc-slot-param'
            );


          paramInputs.forEach(
            paramInput=>{

              paramInput.addEventListener(
                'pointerdown',
                event=>{
                  event.stopPropagation();
                }
              );


              paramInput.addEventListener(
                'input',
                event=>{

                  node.data||={};

                  node.data.params||={};


                  node.data.params[
                    event.target.dataset.paramId
                  ]=
                    event.target.value;


                  emit(
                    'change',
                    getWorkflow()
                  );

                }
              );

            }
          );


          positionPorts(
            element,
            type
          );


          nodeResizeObserver.observe(
            element
          );


          setNodeExpanded(
            element,
            !!node.expanded,
            true
          );

        }


        markConnectedPorts();

        raf(
          renderConnections
        );

      }


      /* =========================
         Port Position
      ========================= */

      function positionPorts(
        nodeEl,
        type
      ){

        if(!type){

          return;

        }


        const height=
          Math.max(
            50,
            nodeEl.offsetHeight
          );


        const inputs=[
          ...nodeEl.querySelectorAll(
            '.vc-port-hit.vc-input'
          )
        ];


        const outputs=[
          ...nodeEl.querySelectorAll(
            '.vc-port-hit.vc-output'
          )
        ];


        function place(
          list,
          ports
        ){

          const count=
            Math.max(
              1,
              ports.length
            );


          list.forEach(
            (element,index)=>{

              const port=
                ports[index];

              const y=
                (
                  (index+1)/
                  (count+1)
                )*
                height;


              element.style.height=
                '32px';

              element.style.top=
                `${y-16}px`;

              element.dataset.portId=
                port.id;

            }
          );

        }


        place(
          inputs,
          type.inputs||
          []
        );

        place(
          outputs,
          type.outputs||
          []
        );

      }


      function markConnectedPorts(){

        for(
          const connection of
          state.connections
        ){

          portEl(
            connection.from.node,
            connection.from.port,
            'output'
          )
          ?.querySelector(
            '.vc-port-pill'
          )
          ?.classList.add(
            'vc-connected'
          );


          portEl(
            connection.to.node,
            connection.to.port,
            'input'
          )
          ?.querySelector(
            '.vc-port-pill'
          )
          ?.classList.add(
            'vc-connected'
          );

        }

      }


      /* =========================
         Connections
      ========================= */

      function renderConnections(){

        connectionLayer.textContent='';


        for(
          const connection of
          state.connections
        ){

          const a=
            portPoint(
              connection.from.node,
              connection.from.port,
              'output'
            );


          const b=
            portPoint(
              connection.to.node,
              connection.to.port,
              'input'
            );


          if(
            !a||
            !b
          ){

            continue;

          }


          const active=
            state.selectedNode===
              connection.from.node||
            state.selectedNode===
              connection.to.node;


          const path=
            svgEl(
              'path',
              {
                d:curve(a,b)
              }
            );


          path.classList.add(
            'vc-connection'
          );


          if(active){

            path.classList.add(
              'vc-active'
            );


            const activeNode=
              getNode(
                state.selectedNode===
                  connection.from.node
                    ?connection.from.node
                    :connection.to.node
              );


            const activeType=
              getNodeType(
                activeNode
              );


            if(
              activeType?.color
            ){

              path.style.stroke=
                activeType.color;

            }

          }


          connectionLayer.appendChild(
            path
          );


          if(!active){

            connectionLayer.appendChild(
              svgEl(
                'circle',
                {
                  cx:a.x,
                  cy:a.y,
                  r:2.8,
                  class:'vc-connection-dot'
                }
              )
            );


            connectionLayer.appendChild(
              svgEl(
                'circle',
                {
                  cx:b.x,
                  cy:b.y,
                  r:2.8,
                  class:'vc-connection-dot'
                }
              )
            );

          }

        }


        if(
          state.connectionDrag
        ){

          renderDragConnection();

        }

      }


      /* =========================
         Expand / Collapse
      ========================= */

      function setNodeExpanded(
        element,
        expanded,
        immediate=false
      ){

        const node=
          getNode(
            element?.dataset.nodeId
          );


        if(
          !element||
          !node
        ){

          return;

        }


        const body=
          element.querySelector(
            '.vc-node-body'
          );


        node.expanded=
          expanded;


        element.classList.toggle(
          'vc-expanded',
          expanded
        );


        const toggle=
          element.querySelector(
            '.vc-node-toggle'
          );


        toggle?.setAttribute(
          'aria-expanded',
          String(expanded)
        );


        toggle?.setAttribute(
          'aria-label',
          expanded
            ?'상세 내용 닫기'
            :'상세 내용 열기'
        );


        positionPorts(
          element,
          getNodeType(node)
        );


        const head=
          element.querySelector(
            '.vc-node-head'
          );


        const collapsedHeight=
          head.offsetHeight+
          20;


        if(immediate){

          body.style.transition=
            'none';

          element.style.transition=
            'none';


          if(expanded){

            body.style.height=
              'auto';

            element.style.height=
              'auto';

          }else{

            body.style.height=
              '0px';

            element.style.height=
              `${collapsedHeight}px`;

          }


          positionPorts(
            element,
            getNodeType(node)
          );


          raf(
            ()=>{

              body.style.transition=
                '';

              element.style.transition=
                '';

              positionPorts(
                element,
                getNodeType(node)
              );

              renderConnections();

            }
          );


          return;

        }


        if(expanded){

          body.style.height=
            '0px';

          element.style.height=
            `${collapsedHeight}px`;


          const targetBody=
            body.scrollHeight;


          const targetHeight=
            collapsedHeight+
            targetBody;


          void element.offsetHeight;


          raf(
            ()=>{

              body.style.height=
                `${targetBody}px`;

              element.style.height=
                `${targetHeight}px`;


              trackExpansion();


              setTimeout(
                ()=>{

                  if(node.expanded){

                    body.style.height=
                      'auto';

                    element.style.height=
                      'auto';


                    positionPorts(
                      element,
                      getNodeType(node)
                    );

                    renderConnections();

                  }

                },
                360
              );

            }
          );


          return;

        }


        const currentHeight=
          element.offsetHeight;

        const currentBodyHeight=
          body.scrollHeight;


        element.style.height=
          `${currentHeight}px`;

        body.style.height=
          `${currentBodyHeight}px`;


        void element.offsetHeight;


        raf(
          ()=>{

            element.style.height=
              `${collapsedHeight}px`;

            body.style.height=
              '0px';

            trackExpansion();

          }
        );

      }


      function trackExpansion(){

        if(
          state.expansionAnimation
        ){

          cancelAnimationFrame(
            state.expansionAnimation
          );

        }


        const started=
          performance.now();

        const duration=
          340;


        const tick=
          now=>{

            renderConnections();


            if(
              now-started<
              duration
            ){

              state.expansionAnimation=
                requestAnimationFrame(
                  tick
                );

            }else{

              state.expansionAnimation=
                null;

              renderConnections();

            }

          };


        state.expansionAnimation=
          requestAnimationFrame(
            tick
          );

      }


      /* =========================
         Node Management
      ========================= */

      function uniqueId(
        prefix='n'
      ){

        let id;


        do{

          id=
            `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;

        }while(
          getNode(id)
        );


        return id;

      }


      function structuredCloneSafe(
        value
      ){

        try{

          return structuredClone(
            value
          );

        }catch{

          return JSON.parse(
            JSON.stringify(value)
          );

        }

      }


      function normalizeNode(
        input
      ){

        return {

          id:
            String(
              input.id||
              uniqueId()
            ),

          type:
            String(
              input.type
            ),

          x:
            Number(input.x)||
            0,

          y:
            Number(input.y)||
            0,

          expanded:
            !!input.expanded,

          data:
            structuredCloneSafe(
              input.data||
              {}
            )

        };

      }


      function findNewNodePosition(){

        const rect=
          canvas.getBoundingClientRect();

        const mobile=
          window.innerWidth<=600;

        const nodeWidth=
          mobile
            ?178
            :190;

        const marginScreen=
          28;

        const leftWorld=
          (
            marginScreen-
            state.offset.x
          )/
          state.scale;

        const topWorld=
          (
            marginScreen-
            state.offset.y
          )/
          state.scale;

        const rightWorld=
          (
            rect.width-
            marginScreen-
            nodeWidth*
            state.scale-
            state.offset.x
          )/
          state.scale;

        const bottomWorld=
          (
            rect.height-
            115-
            nodeWidth*
            0.4*
            state.scale-
            state.offset.y
          )/
          state.scale;


        const minX=
          Math.min(
            leftWorld,
            rightWorld
          );

        const maxX=
          Math.max(
            leftWorld,
            rightWorld
          );

        const minY=
          Math.min(
            topWorld,
            bottomWorld
          );

        const maxY=
          Math.max(
            topWorld,
            bottomWorld
          );


        const centerX=
          (minX+maxX)/2;

        const centerY=
          (minY+maxY)/2;

        const gap=
          24;

        const estimatedHeight=
          54;


        const spots=[

          {
            x:
              centerX-
              nodeWidth/2,

            y:
              centerY-
              estimatedHeight/2

          },

          {
            x:
              centerX-
              nodeWidth/2,

            y:
              centerY-
              estimatedHeight/2+
              estimatedHeight+
              gap

          },

          {
            x:
              centerX-
              nodeWidth/2,

            y:
              centerY-
              estimatedHeight/2-
              estimatedHeight-
              gap

          },

          {
            x:
              centerX-
              nodeWidth/2-
              nodeWidth-
              gap,

            y:
              centerY-
              estimatedHeight/2

          },

          {
            x:
              centerX-
              nodeWidth/2+
              nodeWidth+
              gap,

            y:
              centerY-
              estimatedHeight/2

          },

          {
            x:minX,
            y:minY
          }

        ];


        const valid=
          spots.find(
            position=>{

              if(
                position.x<minX||
                position.x>maxX||
                position.y<minY||
                position.y>maxY
              ){

                return false;

              }


              return !state.nodes.some(
                node=>
                  Math.abs(
                    node.x-
                    position.x
                  )<
                    nodeWidth+
                    gap&&
                  Math.abs(
                    node.y-
                    position.y
                  )<
                    estimatedHeight+
                    gap
              );

            }
          );


        return(
          valid||
          {
            x:
              clamp(
                centerX-
                nodeWidth/2,
                minX,
                maxX
              ),

            y:
              clamp(
                centerY-
                estimatedHeight/2,
                minY,
                maxY
              )
          }
        );

      }


      function addNode(
        type,
        nodeData={}
      ){

        if(
          !registry.has(type)
        ){

          throw new Error(
            `Unknown node type: ${type}`
          );

        }


        if(
          type==='start'
        ){

          const existing=
            state.nodes.find(
              node=>
                node.type==='start'
            );


          if(existing){

            selectNode(
              existing.id
            );

            closeAddMenu();

            return existing;

          }

        }


        const position=
          nodeData.x!=null&&
          nodeData.y!=null
            ?{
              x:nodeData.x,
              y:nodeData.y
            }
            :findNewNodePosition();


        const node=
          normalizeNode({

            id:
              nodeData.id||
              uniqueId(),

            type,

            x:position.x,

            y:position.y,

            expanded:true,

            data:
              nodeData.data

          });


        state.nodes.push(
          node
        );


        state.selectedNode=
          node.id;


        render();

        closeAddMenu();

        emit(
          'change',
          getWorkflow()
        );


        return node;

      }


      function removeNode(
        id
      ){

        const node=
          getNode(id);


        if(
          !node||
          node.type==='start'
        ){

          return false;

        }


        state.connections=
          state.connections.filter(
            connection=>
              connection.from.node!==id&&
              connection.to.node!==id
          );


        const index=
          state.nodes.findIndex(
            node=>
              node.id===id
          );


        if(index<0){

          return false;

        }


        state.nodes.splice(
          index,
          1
        );


        if(
          state.selectedNode===id
        ){

          state.selectedNode=
            null;

        }


        render();

        emit(
          'change',
          getWorkflow()
        );


        return true;

      }


      function setNodePosition(
        node,
        x,
        y
      ){

        node.x=
          x;

        node.y=
          y;


        const element=
          getNodeElement(
            node.id
          );


        if(element){

          element.style.left=
            `${x}px`;

          element.style.top=
            `${y}px`;

        }


        renderConnections();


        emit(
          'change',
          getWorkflow()
        );

      }


      function selectNode(
        id
      ){

        if(
          id!==null&&
          !getNode(id)
        ){

          id=null;

        }


        state.selectedNode=
          id;


        nodesLayer
          .querySelectorAll(
            '.vc-node'
          )
          .forEach(
            element=>
              element.classList.toggle(
                'vc-selected',
                element.dataset.nodeId===id
              )
          );


        renderConnections();

        updateComposerState();

        emit(
          'select',
          id
        );

      }


      function toggleNodeExpanded(
        id
      ){

        const node=
          getNode(id);

        const element=
          getNodeElement(id);


        if(
          !node||
          !element
        ){

          return;

        }


        setNodeExpanded(
          element,
          !node.expanded
        );


        selectNode(
          id
        );


        emit(
          'change',
          getWorkflow()
        );

      }


      /* =========================
         Connection Validation
      ========================= */

      function connectionValid(
        sourceNodeId,
        sourcePortId,
        targetNodeId,
        targetPortId
      ){

        const errors=[];

        const warnings=[];


        if(
          sourceNodeId===
          targetNodeId
        ){

          errors.push({
            code:'SELF_CONNECTION',
            message:
              '노드는 자기 자신에게 연결할 수 없습니다.'
          });

        }


        const source=
          getNode(
            sourceNodeId
          );

        const target=
          getNode(
            targetNodeId
          );


        if(!source){

          errors.push({
            code:'MISSING_SOURCE_NODE',
            message:
              `출발 노드 ${sourceNodeId}가 존재하지 않습니다.`
          });

        }


        if(!target){

          errors.push({
            code:'MISSING_TARGET_NODE',
            message:
              `대상 노드 ${targetNodeId}가 존재하지 않습니다.`
          });

        }


        const output=
          portDef(
            sourceNodeId,
            sourcePortId,
            'output'
          );

        const input=
          portDef(
            targetNodeId,
            targetPortId,
            'input'
          );


        if(!output){

          errors.push({
            code:'MISSING_SOURCE_PORT',
            message:
              `출력 포트 ${sourcePortId}가 존재하지 않습니다.`
          });

        }


        if(!input){

          errors.push({
            code:'MISSING_TARGET_PORT',
            message:
              `입력 포트 ${targetPortId}가 존재하지 않습니다.`
          });

        }


        if(errors.length){

          return {
            ok:false,
            errors,
            warnings
          };

        }


        const duplicate=
          state.connections.find(
            connection=>
              connection.from.node===
                sourceNodeId&&
              connection.from.port===
                sourcePortId&&
              connection.to.node===
                targetNodeId&&
              connection.to.port===
                targetPortId
          );


        if(duplicate){

          errors.push({
            code:'DUPLICATE_CONNECTION',
            message:
              '동일한 연결이 이미 존재합니다.'
          });

        }


        const incoming=
          state.connections.filter(
            connection=>
              connection.to.node===
                targetNodeId&&
              connection.to.port===
                targetPortId
          );


        if(
          !input.multiple&&
          incoming.length
        ){

          errors.push({
            code:'INPUT_MULTIPLE',
            message:
              `입력 포트 ${input.name}은 하나의 연결만 허용합니다.`
          });

        }


        const accepts=
          Array.isArray(
            input.accepts
          )
            ?input.accepts
            :['any'];


        const accepted=
          accepts.includes('any')||
          accepts.includes(output.type)||
          output.type==='any';


        if(!accepted){

          errors.push({
            code:'TYPE_MISMATCH',
            message:
              `${output.type} → ${input.type} 타입을 연결할 수 없습니다.`
          });

        }


        if(
          wouldCreateCycle(
            sourceNodeId,
            targetNodeId
          )
        ){

          errors.push({
            code:'CYCLE',
            message:
              '이 연결은 순환 구조(Cycle)를 만듭니다.'
          });

        }


        return {
          ok:
            errors.length===0,

          errors,

          warnings

        };

      }


      function wouldCreateCycle(
        fromId,
        toId
      ){

        if(
          fromId===toId
        ){

          return true;

        }


        const adjacency=
          new Map();


        for(
          const connection of
          state.connections
        ){

          if(
            !adjacency.has(
              connection.from.node
            )
          ){

            adjacency.set(
              connection.from.node,
              []
            );

          }


          adjacency
            .get(
              connection.from.node
            )
            .push(
              connection.to.node
            );

        }


        if(
          !adjacency.has(
            toId
          )
        ){

          return false;

        }


        const stack=[
          toId
        ];

        const seen=
          new Set();


        while(
          stack.length
        ){

          const current=
            stack.pop();


          if(
            current===fromId
          ){

            return true;

          }


          if(
            seen.has(current)
          ){

            continue;

          }


          seen.add(
            current
          );


          for(
            const next of
            adjacency.get(
              current
            )||[]
          ){

            stack.push(
              next
            );

          }

        }


        return false;

      }


      function canConnect(
        specification
      ){

        const result=
          connectionValid(
            specification.from.node,
            specification.from.port,
            specification.to.node,
            specification.to.port
          );


        emit(
          'validate',
          result
        );


        return result;

      }


      function uniqueConnectionId(){

        let id;


        do{

          id=
            `c${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;

        }while(
          state.connections.some(
            connection=>
              connection.id===id
          )
        );


        return id;

      }


      function connect(
        from,
        to,
        options={}
      ){

        const specification={

          from:{
            node:from.node,
            port:from.port
          },

          to:{
            node:to.node,
            port:to.port
          }

        };


        const duplicate=
          state.connections.find(
            connection=>
              connection.from.node===
                specification.from.node&&
              connection.from.port===
                specification.from.port&&
              connection.to.node===
                specification.to.node&&
              connection.to.port===
                specification.to.port
          );


        if(duplicate){

          disconnect(
            duplicate.id
          );

          return null;

        }


        const check=
          canConnect(
            specification
          );


        if(!check.ok){

          showValidation(
            check.errors,
            check.warnings
          );

          return null;

        }


        const connection={

          id:
            uniqueConnectionId(),

          from:
            specification.from,

          to:
            specification.to,

          ...(options.data
            ?{
              data:
                structuredCloneSafe(
                  options.data
                )
            }
            :{})

        };


        state.connections.push(
          connection
        );


        render();

        emit(
          'connect',
          connection
        );

        emit(
          'change',
          getWorkflow()
        );


        return connection;

      }


      function disconnect(
        id
      ){

        const index=
          state.connections.findIndex(
            connection=>
              connection.id===id
          );


        if(index<0){

          return false;

        }


        state.connections.splice(
          index,
          1
        );


        render();

        emit(
          'change',
          getWorkflow()
        );


        return true;

      }


      /* =========================
         Workflow Validation
      ========================= */

      function validate(){

        const errors=[];

        const warnings=[];

        const ids=
          new Set();


        for(
          const node of
          state.nodes
        ){

          if(
            ids.has(
              node.id
            )
          ){

            errors.push({
              code:'DUPLICATE_NODE_ID',
              node:node.id,
              message:
                `노드 ID ${node.id}가 중복됩니다.`
            });

          }


          ids.add(
            node.id
          );


          if(
            !registry.has(
              node.type
            )
          ){

            errors.push({
              code:'UNKNOWN_NODE_TYPE',
              node:node.id,
              message:
                `노드 타입 ${node.type}이 등록되어 있지 않습니다.`
            });

          }

        }


        const nodeSet=
          new Set(
            state.nodes.map(
              node=>node.id
            )
          );


        const connectionKeys=
          new Set();


        for(
          const connection of
          state.connections
        ){

          if(
            !nodeSet.has(
              connection.from.node
            )
          ){

            errors.push({
              code:'MISSING_SOURCE_NODE',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}의 출발 노드가 없습니다.`
            });

          }


          if(
            !nodeSet.has(
              connection.to.node
            )
          ){

            errors.push({
              code:'MISSING_TARGET_NODE',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}의 대상 노드가 없습니다.`
            });

          }


          if(
            connection.from.node===
            connection.to.node
          ){

            errors.push({
              code:'SELF_CONNECTION',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}가 자기 자신을 가리킵니다.`
            });

          }


          const key=
            connectionKey(
              connection
            );


          if(
            connectionKeys.has(key)
          ){

            errors.push({
              code:'DUPLICATE_CONNECTION',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}가 중복됩니다.`
            });

          }


          connectionKeys.add(
            key
          );


          const output=
            portDef(
              connection.from.node,
              connection.from.port,
              'output'
            );


          const input=
            portDef(
              connection.to.node,
              connection.to.port,
              'input'
            );


          if(!output){

            errors.push({
              code:'MISSING_SOURCE_PORT',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}의 출력 포트가 없습니다.`
            });

          }


          if(!input){

            errors.push({
              code:'MISSING_TARGET_PORT',
              connection:
                connection.id,
              message:
                `연결 ${connection.id}의 입력 포트가 없습니다.`
            });

          }


          if(
            output&&
            input
          ){

            const accepts=
              Array.isArray(
                input.accepts
              )
                ?input.accepts
                :['any'];


            const compatible=
              accepts.includes(
                'any'
              )||
              accepts.includes(
                output.type
              )||
              output.type===
                'any';


            if(!compatible){

              errors.push({
                code:'TYPE_MISMATCH',
                connection:
                  connection.id,
                message:
                  `${output.type} → ${input.type} 타입이 호환되지 않습니다.`
              });

            }

          }

        }


        for(
          const node of
          state.nodes
        ){

          const type=
            getNodeType(
              node
            );


          if(!type){

            continue;

          }


          for(
            const port of
            type.inputs
          ){

            const incoming=
              state.connections.filter(
                connection=>
                  connection.to.node===
                    node.id&&
                  connection.to.port===
                    port.id
              );


            if(
              port.required&&
              !incoming.length
            ){

              errors.push({
                code:'REQUIRED_INPUT',
                node:node.id,
                port:port.id,
                message:
                  `${type.name}의 필수 입력 '${port.name}'이 연결되지 않았습니다.`
              });

            }


            if(
              !port.multiple&&
              incoming.length>1
            ){

              errors.push({
                code:'INPUT_MULTIPLE',
                node:node.id,
                port:port.id,
                message:
                  `${type.name}의 '${port.name}'은 단일 입력만 허용합니다.`
              });

            }

          }

        }


        const connectedNodes=
          new Set();


        for(
          const connection of
          state.connections
        ){

          connectedNodes.add(
            connection.from.node
          );

          connectedNodes.add(
            connection.to.node
          );

        }


        const startNodes=
          state.nodes.filter(
            node=>
              node.type==='start'
          );


        for(
          const node of
          state.nodes
        ){

          if(
            node.type!=='start'&&
            !connectedNodes.has(
              node.id
            )
          ){

            warnings.push({
              code:'ISOLATED_NODE',
              node:node.id,
              message:
                `노드 '${getNodeType(node)?.name||node.type}'가 그래프와 연결되지 않았습니다.`
            });

          }

        }


        if(
          startNodes.length===0
        ){

          warnings.push({
            code:'NO_START_NODE',
            message:
              '시작 노드가 없습니다.'
          });

        }


        if(
          startNodes.length>1
        ){

          warnings.push({
            code:'MULTIPLE_START_NODE',
            message:
              '시작 노드가 여러 개입니다.'
          });

        }


        const graph={

          nodes:
            state.nodes.map(
              node=>node.id
            ),

          adjacency:
            new Map()

        };


        for(
          const connection of
          state.connections
        ){

          if(
            !graph.adjacency.has(
              connection.from.node
            )
          ){

            graph.adjacency.set(
              connection.from.node,
              []
            );

          }


          graph
            .adjacency
            .get(
              connection.from.node
            )
            .push(
              connection.to.node
            );

        }


        const cycleNodes=
          new Set();


        for(
          const nodeId of
          graph.nodes
        ){

          const visiting=
            new Set();

          const visited=
            new Set();


          if(
            hasCycleFrom(
              nodeId,
              graph.adjacency,
              visiting,
              visited
            )
          ){

            cycleNodes.add(
              nodeId
            );

          }

        }


        if(
          cycleNodes.size
        ){

          errors.push({
            code:'CYCLE',
            nodes:[
              ...cycleNodes
            ],
            message:
              '워크플로우에 순환 구조(Cycle)가 존재합니다.'
          });

        }


        const result={

          valid:
            errors.length===0,

          errors,

          warnings

        };


        emit(
          'validate',
          result
        );


        return result;

      }


      function hasCycleFrom(
        node,
        adjacency,
        visiting,
        visited
      ){

        if(
          visiting.has(
            node
          )
        ){

          return true;

        }


        if(
          visited.has(
            node
          )
        ){

          return false;

        }


        visiting.add(
          node
        );


        for(
          const next of
          adjacency.get(
            node
          )||[]
        ){

          if(
            hasCycleFrom(
              next,
              adjacency,
              visiting,
              visited
            )
          ){

            return true;

          }

        }


        visiting.delete(
          node
        );

        visited.add(
          node
        );


        return false;

      }


      /* =========================
         Workflow State
      ========================= */

      function getWorkflow(){

        return {

          nodes:
            structuredCloneSafe(
              state.nodes
            ),

          connections:
            structuredCloneSafe(
              state.connections
            )

        };

      }


      function getState(){

        return {

          workflow:
            getWorkflow(),

          viewport:{

            scale:
              state.scale,

            offset:{
              ...state.offset
            }

          }

        };

      }


      function setState(
        saved={}
      ){

        const workflow=
          saved.workflow||
          saved;


        state.nodes=
          Array.isArray(
            workflow.nodes
          )
            ?workflow.nodes
              .map(
                normalizeNode
              )
              .filter(
                node=>
                  registry.has(
                    node.type
                  )
              )
            :[];


        state.connections=
          Array.isArray(
            workflow.connections
          )
            ?structuredCloneSafe(
                workflow.connections
              )
              .map(
                connection=>({

                  id:
                    String(
                      connection.id||
                      uniqueConnectionId()
                    ),

                  from:{

                    node:
                      String(
                        connection.from?.node??
                        connection.from??
                        ''
                      ),

                    port:
                      String(
                        connection.from?.port??
                        'out'
                      )

                  },

                  to:{

                    node:
                      String(
                        connection.to?.node??
                        connection.to??
                        ''
                      ),

                    port:
                      String(
                        connection.to?.port??
                        'in'
                      )

                  },

                  ...(connection.data
                    ?{
                      data:
                        structuredCloneSafe(
                          connection.data
                        )
                    }
                    :{})

                })
              )
            :[];


        if(
          saved.viewport
        ){

          state.scale=
            clamp(
              Number(
                saved.viewport.scale
              )||
              1,
              .12,
              3
            );


          state.offset={

            x:
              Number(
                saved.viewport.offset?.x
              )||
              0,

            y:
              Number(
                saved.viewport.offset?.y
              )||
              0

          };

        }


        state.selectedNode=
          null;


        render();

        emit(
          'change',
          getWorkflow()
        );


        return api;

      }


      /* =========================
         Validation UI
      ========================= */

      function showValidation(
        errors,
        warnings
      ){

        validationLayer.textContent='';


        const items=[

          ...errors
            .slice(
              0,
              3
            )
            .map(
              item=>({
                cls:'vc-error',
                text:item.message
              })
            ),

          ...warnings
            .slice(
              0,
              2
            )
            .map(
              item=>({
                cls:'vc-warning',
                text:item.message
              })
            )

        ];


        if(!items.length){

          return;

        }


        for(
          const item of items
        ){

          const element=
            document.createElement(
              'div'
            );


          element.className=
            `vc-validation-item ${item.cls}`;


          element.textContent=
            item.text;


          validationLayer.appendChild(
            element
          );


          raf(
            ()=>{
              element.classList.add(
                'vc-show'
              );
            }
          );

        }


        if(
          state.validationTimer
        ){

          clearTimeout(
            state.validationTimer
          );

        }


        state.validationTimer=
          setTimeout(
            ()=>{

              validationLayer
                .querySelectorAll(
                  '.vc-validation-item'
                )
                .forEach(
                  element=>
                    element.classList.remove(
                      'vc-show'
                    )
                );


              setTimeout(
                ()=>{
                  validationLayer.textContent='';
                },
                200
              );

            },
            2800
          );

      }


      function render(){

        renderTransform();

        renderNodes();

        renderConnections();

        updateComposerState();

      }


      /* =========================
         Add Menu
      ========================= */

      function renderMenu(){

        addMenu.textContent='';


        for(
          const [key,type]
            of registry
        ){

          /*
            hidden은 서버 Definition에서
            그대로 존중한다.
          */
          if(
            type.hidden
          ){

            continue;

          }


          const button=
            document.createElement(
              'button'
            );


          button.type=
            'button';

          button.className=
            'vc-menu-item';

          button.dataset.nodeType=
            key;


          button.innerHTML=`

            <span
              class="vc-menu-icon"
              style="color:${
                type.color||
                'var(--sub)'
              }"
            >
              ${type.icon||''}
            </span>

            <span class="vc-menu-name">
              ${escapeHtml(
                type.name||
                key
              )}
            </span>

            <span class="vc-menu-desc">
              ${escapeHtml(
                type.tag||
                ''
              )}
            </span>

          `;


          addMenu.appendChild(
            button
          );

        }

      }


      function openAddMenu(){

        addMenu.classList.add(
          'vc-open'
        );

        addButton.classList.add(
          'vc-open'
        );

        addButton.setAttribute(
          'aria-expanded',
          'true'
        );

        state.addMenuOpen=
          true;

      }


      function closeAddMenu(){

        addMenu.classList.remove(
          'vc-open'
        );

        addButton.classList.remove(
          'vc-open'
        );

        addButton.setAttribute(
          'aria-expanded',
          'false'
        );

        state.addMenuOpen=
          false;

      }


      function toggleAddMenu(){

        state.addMenuOpen
          ?closeAddMenu()
          :openAddMenu();

      }


      /* =========================
         Connection Drag
      ========================= */

      function startNodeDrag(){

        if(
          !state.nodeDrag||
          state.nodeDrag.moved
        ){

          return;

        }


        const element=
          getNodeElement(
            state.nodeDrag.node.id
          );


        if(!element){

          return;

        }


        state.nodeDrag.moved=
          true;


        state.nodeDrag.wasExpanded=
          !!state.nodeDrag.node.expanded;


        if(
          state.nodeDrag.wasExpanded
        ){

          setNodeExpanded(
            element,
            false
          );

        }


        element.classList.add(
          'vc-dragging'
        );

      }


      function finishNodeDrag(){

        const drag=
          state.nodeDrag;


        if(!drag){

          return;

        }


        const element=
          getNodeElement(
            drag.node.id
          );


        if(element){

          element.classList.remove(
            'vc-dragging'
          );


          if(
            drag.wasExpanded
          ){

            setNodeExpanded(
              element,
              true
            );

          }

        }


        state.nodeDrag=
          null;


        renderConnections();


        emit(
          'change',
          getWorkflow()
        );

      }


      function renderDragConnection(){

        dragConnectionLayer.textContent='';


        const drag=
          state.connectionDrag;


        if(!drag){

          return;

        }


        const a=
          portPoint(
            drag.from.node,
            drag.from.port,
            'output'
          );


        if(!a){

          return;

        }


        const b=
          screenToWorld(
            drag.x,
            drag.y
          );


        const sourceNode=
          getNode(
            drag.from.node
          );


        const sourceType=
          getNodeType(
            sourceNode
          );


        const path=
          svgEl(
            'path',
            {
              d:
                curve(
                  a,
                  b
                ),

              'marker-end':
                `url(#${markerId})`
            }
          );


        path.classList.add(
          'vc-drag-connection'
        );


        if(
          sourceType?.color
        ){

          path.style.stroke=
            sourceType.color;

        }


        dragConnectionLayer.appendChild(
          path
        );


        const dot=
          svgEl(
            'circle',
            {
              cx:a.x,
              cy:a.y,
              r:4,
              class:
                'vc-drag-source-dot'
            }
          );


        if(
          sourceType?.color
        ){

          dot.style.fill=
            sourceType.color;

        }


        dragConnectionLayer.appendChild(
          dot
        );

      }


      function finishConnection(
        event
      ){

        dragConnectionLayer.textContent='';


        const drag=
          state.connectionDrag;


        if(!drag){

          return;

        }


        const target=
          document
            .elementFromPoint(
              event.clientX,
              event.clientY
            )
            ?.closest(
              '.vc-port-hit.vc-input'
            );


        const targetNode=
          target?.closest(
            '.vc-node'
          );


        const toNode=
          targetNode?.dataset.nodeId;


        const toPort=
          target?.dataset.portId;


        if(
          toNode&&
          toPort
        ){

          connect(
            drag.from,
            {
              node:toNode,
              port:toPort
            }
          );

        }


        state.connectionDrag=
          null;


        renderConnections();

      }


      /* =========================
         Theme / Composer
      ========================= */

      function setTheme(
        theme
      ){

        document.documentElement.classList.toggle(
          'dark',
          theme==='dark'
        );


        try{

          localStorage.setItem(
            'visual-ai-theme',
            theme
          );

        }catch{}


        emit(
          'theme',
          theme
        );

      }


      function applySavedTheme(){

        let theme=
          'light';


        try{

          theme=
            localStorage.getItem(
              'visual-ai-theme'
            )||
            'light';

        }catch{}


        setTheme(
          theme
        );

      }


      function updateComposerState(){

        const hasText=
          chatInput.value.trim().length>
          0;


        const active=
          hasText||
          state.selectedNode!==null||
          state.aiBusy;


        chatForm.classList.toggle(
          'vc-has-text',
          hasText
        );

        chatForm.classList.toggle(
          'vc-active',
          active
        );

        chatForm.classList.toggle(
          'vc-ai-busy',
          state.aiBusy
        );


        chatForm.setAttribute(
          'aria-busy',
          String(
            state.aiBusy
          )
        );


        chatInput.disabled=
          state.aiBusy;

        attachButton.disabled=
          state.aiBusy;


        qs(
          '.vc-send-button'
        ).disabled=
          state.aiBusy;


        chatInput.placeholder=
          state.aiBusy
            ?'작업을 생성하는 중…'
            :'무엇을 만들까요?';


        chatInput.style.height=
          'auto';


        chatInput.style.height=
          Math.min(
            chatInput.scrollHeight,
            115
          )+
          'px';

      }


      function setAIWaiting(
        busy
      ){

        state.aiBusy=
          !!busy;


        const sendButton=
          qs(
            '.vc-send-button'
          );


        const attach=
          qs(
            '.vc-attach-button'
          );


        if(
          state.aiBusy
        ){

          sendButton.innerHTML=`
            <span
              class="vc-ai-spinner"
              aria-hidden="true"
            ></span>
          `;


          sendButton.setAttribute(
            'aria-label',
            '작업 생성 중'
          );


          sendButton.setAttribute(
            'title',
            '작업 생성 중'
          );


          attach.setAttribute(
            'aria-disabled',
            'true'
          );


          chatInput.setAttribute(
            'aria-busy',
            'true'
          );

        }else{

          sendButton.innerHTML=
            sendIcon;


          sendButton.setAttribute(
            'aria-label',
            '보내기'
          );


          sendButton.removeAttribute(
            'title'
          );


          attach.removeAttribute(
            'aria-disabled'
          );


          chatInput.removeAttribute(
            'aria-busy'
          );

        }


        updateComposerState();

      }


      /* =========================
         Drag / Pointer
      ========================= */

      listen(
        addButton,
        'click',
        event=>{

          event.preventDefault();

          event.stopPropagation();

          toggleAddMenu();

        }
      );


      listen(
        addMenu,
        'pointerdown',
        event=>
          event.stopPropagation()
      );


      listen(
        addMenu,
        'click',
        event=>{

          const item=
            event.target.closest(
              '.vc-menu-item'
            );


          if(!item){

            return;

          }


          addNode(
            item.dataset.nodeType
          );

        }
      );
