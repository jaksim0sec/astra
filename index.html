};
  function normalizePort(port,index,dir){
    const p={...port};
    p.id=String(p.id||`${dir}-${index}`);
    p.name=p.name??p.id;
    p.type=p.type||'any';
    p.required=!!p.required;
    p.multiple=p.multiple!==false;
    p.accepts=Array.isArray(p.accepts)&&p.accepts.length?p.accepts.slice():['any'];
    return p;
  }
  function normalizeNodeType(type,def){
    const d={...def};
    d.inputs=(d.inputs||[]).map((p,i)=>normalizePort(p,i,'input'));
    d.outputs=(d.outputs||[]).map((p,i)=>normalizePort(p,i,'output'));
    d.slots={description:true,param:true,body:true,footer:true,...(d.slots||{})};
    d.tag=d.tag||type.toUpperCase();
    d.color=d.color||'#888';
    return d;
  }

        if(n) positionPorts(el,getNodeType(n));
      }

    });

    const root=document.createElement('div');
    root.className='vc-root';
    root.dataset.vcInstance=uid;
    root.innerHTML=`

          </svg>

        </div>

        <button type="button" class="vc-top-button vc-add-button" aria-label="노드 추가" aria-expanded="false">${addIcon}</button>
      </div>
      <div class="vc-add-menu"></div>
      <div class="vc-composer-wrap">
        <form class="vc-composer">
          <button type="button" class="vc-composer-button vc-attach-button" aria-label="파일 추가">${attachIcon}</button>
          <textarea rows="1" class="vc-chat-input" placeholder="무엇을 만들까요?"></textarea>
          <button type="submit" class="vc-composer-button vc-send-button" aria-label="보내기">${sendIcon}</button>
        </form>
        <input class="vc-file-input" type="file" multiple hidden>
      </div>`;
    target.appendChild(root);

    const qs=s=>root.querySelector(s);
    const canvas=qs('.vc-canvas');
    const world=qs('.vc-world');
    const nodesLayer=qs('.vc-nodes');
    const connectionLayer=qs('.vc-connection-layer');
    const dragConnectionLayer=qs('.vc-drag-connection-layer');
    const zoomIndicator=qs('.vc-zoom-indicator');
    const validationLayer=qs('.vc-validation');
    const addButton=qs('.vc-add-button');
    const addMenu=qs('.vc-add-menu');
    const themeButton=qs('.vc-theme-button');
    const chatForm=qs('.vc-composer');
    const chatInput=qs('.vc-chat-input');
    const attachButton=qs('.vc-attach-button');
    const fileInput=qs('.vc-file-input');

    const markerId=`${uid}-arrow`;
    qs('.vc-arrow-marker').setAttribute('id',markerId);

    function on(event,handler){
      if(typeof handler!=='function') return ()=>{};
      if(!events.has(event)) events.set(event,new Set());
      events.get(event).add(handler);
      return ()=>off(event,handler);
    }
    function off(event,handler){events.get(event)?.delete(handler)}
    function emit(event,payload){for(const fn of events.get(event)||[]) try{fn(payload,api)}catch(error){console.error(error)}}
    function listen(el,type,fn,opts){el.addEventListener(type,fn,opts);listeners.push(()=>el.removeEventListener(type,fn,opts))}
    function raf(fn){const id=requestAnimationFrame(t=>{state.rafIds.delete(id);if(!state.destroyed) fn(t)});state.rafIds.add(id);return id}

    function getNode(id){return state.nodes.find(n=>n.id===id)||null}
    function getNodeElement(id){
      return nodesLayer.querySelector(`.vc-node[data-node-id="${CSS.escape(String(id))}"]`)
    }
    function getNodeType(node){return node?registry.get(node.type):null}
    function screenToWorld(x,y){return{x:(x-state.offset.x)/state.scale,y:(y-state.offset.y)/state.scale}}
    function renderTransform(){
      world.style.transform=`translate(${state.offset.x}px,${state.offset.y}px) scale(${state.scale})`;
      zoomIndicator.textContent=`${Math.round(state.scale*100)}%`;
    }
    function svgEl(name,attrs={}){
      const e=document.createElementNS(svgNS,name);
      for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
      return e;
    }
    function connectionKey(c){return `${c.from.node}:${c.from.port}->${c.to.node}:${c.to.port}`}
    function portDef(nodeId,portId,dir){
      const n=getNode(nodeId); const t=getNodeType(n); if(!n||!t)return null;
      return (dir==='input'?t.inputs:t.outputs).find(p=>p.id===portId)||null;
    }
    function portEl(nodeId,portId,dir){
      return nodesLayer.querySelector(`.vc-port-hit[data-node-id="${CSS.escape(String(nodeId))}"][data-port-id="${CSS.escape(String(portId))}"][data-port-dir="${dir}"]`)
    }
    function portPoint(nodeId,portId,dir){
      const el=portEl(nodeId,portId,dir); if(!el) return null;
      const anchor=el.querySelector('.vc-port-anchor')||el;
      const r=anchor.getBoundingClientRect();
      const cr=canvas.getBoundingClientRect();
      return {x:(r.left+r.width/2-cr.left-state.offset.x)/state.scale,y:(r.top+r.height/2-cr.top-state.offset.y)/state.scale};
    }
    function curve(a,b){
      const dx=b.x-a.x;
      const bend=clamp(Math.abs(dx)*.22+Math.abs(b.y-a.y)*.05,28,85);
      return `M ${a.x} ${a.y} C ${a.x+bend} ${a.y}, ${b.x-bend} ${b.y}, ${b.x} ${b.y}`;
    }

    function renderSlotContent(n,t){
      const body=[];
      if(t.slots.description!==false && (t.desc||t.description)) body.push(`<div class="vc-slot-description">${escapeHtml(t.desc||t.description||'')}</div>`);
      if(t.slots.param!==false && Array.isArray(t.params)){
        const values=n.data?.params||{};

        for(const p of t.params){
          const value=values[p.id]??'';

          body.push(`
            <div class="vc-param-group">
              <label class="vc-param-label">${escapeHtml(p.name||p.id)}</label>
              <input
                class="vc-slot-param"
                type="text"
                data-param-id="${escapeHtml(p.id)}"
                value="${escapeHtml(value)}"
                placeholder="${escapeHtml(p.placeholder||'')}"
              >
            </div>
          `);
        }
      }
      if(typeof t.renderBody==='function'){
        const custom=t.renderBody(n,{node:n,type:t,instance:api});
        if(custom instanceof Node) body.push(custom.outerHTML); else if(typeof custom==='string') body.push(`<div class="vc-slot-custom">${custom}</div>`);
      }
      if(t.slots.footer!==false && t.footer) body.push(typeof t.footer==='function'?`<div class="vc-slot-custom">${t.footer(n,{node:n,type:t,instance:api})||''}</div>`:`<div class="vc-slot-custom">${t.footer}</div>`);
      //if(n.type!=='start') body.push(`<div class="vc-node-delete-row"><button type="button" class="vc-node-delete-button" data-action="delete-expanded" aria-label="노드 삭제">${deleteIcon}<span>노드 삭제</span></button></div>`);
      return body.join('');
    }
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

    function renderNodes(){
      nodesLayer.textContent='';
      for(const n of state.nodes){
        const t=getNodeType(n); if(!t) continue;
        const el=document.createElement('div');
        const isImageFile=n.type==='file'&&n.data?.mime?.startsWith('image/');

        el.className=
            `vc-node${n.type==='start'?' vc-start-node':''}`+
            `${n.type==='file'?' vc-file-node':''}`+
            `${isImageFile?' vc-image-file-node':''}`;

        if(isImageFile&&n.data?.previewUrl){
            el.style.setProperty('--vc-file-bg',`url("${n.data.previewUrl}")`);
        }
        if(n.id===state.selectedNode) el.classList.add('vc-selected');
        if(n.expanded) el.classList.add('vc-expanded');
        el.dataset.nodeId=n.id;
        el.style.left=`${n.x}px`;
        el.style.top=`${n.y}px`;
        el.style.setProperty('--node-color',t.color);
        const fileName=n.type==='file'?(n.data?.name||'이름 없는 파일'):t.name;
        const fileExt=n.type==='file'&&fileName.includes('.')?fileName.split('.').pop().toUpperCase():'FILE';
        el.innerHTML=`
          <div class="vc-node-head">
            <span class="vc-node-icon">${iconSvg[n.type]||''}</span>
            ${n.type==='file'?`<span class="vc-file-title-wrap"><span class="vc-file-title" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span><span class="vc-file-type">${escapeHtml(fileExt)}</span></span>`:`<span class="vc-node-title">${escapeHtml(t.name)}</span>`}
            ${n.type==='start'?'<span class="vc-start-badge">START</span>':''}
            <div class="vc-node-actions">
              ${n.type!=='start'?`<button type="button" class="vc-node-action vc-node-delete" data-action="delete" aria-label="노드 삭제">${deleteIcon}</button>`:''}
              <button type="button" class="vc-node-action vc-node-toggle" data-action="toggle" aria-label="상세 내용 열기" aria-expanded="${!!n.expanded}">${toggleIcon}</button>
            </div>
          </div>
          <div class="vc-node-body">${renderSlotContent(n,t)}</div>
          ${t.inputs.map(p=>`<div class="vc-port-hit vc-input" data-port-dir="input" data-port-id="${escapeHtml(p.id)}" data-node-id="${escapeHtml(n.id)}"><span class="vc-port-anchor"><span class="vc-port-pill"></span></span><span class="vc-port-label">${escapeHtml(p.name)}</span></div>`).join('')}
          ${t.outputs.map(p=>`<div class="vc-port-hit vc-output" data-port-dir="output" data-port-id="${escapeHtml(p.id)}" data-node-id="${escapeHtml(n.id)}"><span class="vc-port-anchor"><span class="vc-port-pill"></span></span><span class="vc-port-label">${escapeHtml(p.name)}</span></div>`).join('')}`;
          nodesLayer.appendChild(el);
          const paramInputs=el.querySelectorAll('.vc-slot-param');

          paramInputs.forEach(paramInput=>{
            paramInput.addEventListener('pointerdown',e=>{
              e.stopPropagation();
            });

            paramInput.addEventListener('input',e=>{
              n.data ||= {};
              n.data.params ||= {};

              n.data.params[e.target.dataset.paramId]=e.target.value;

              emit('change',getWorkflow());
            });
          });

          positionPorts(el,t);
          nodeResizeObserver.observe(el);
          setNodeExpanded(el,!!n.expanded,true);
      }
      markConnectedPorts();
      raf(renderConnections);
    }

    function positionPorts(nodeEl,type){
      const height=Math.max(50,nodeEl.offsetHeight);
      const inputs=[...nodeEl.querySelectorAll('.vc-port-hit.vc-input')];
      const outputs=[...nodeEl.querySelectorAll('.vc-port-hit.vc-output')];
      function place(list,ports){
        const count=Math.max(1,ports.length);
        list.forEach((el,i)=>{const port=ports[i]; const y=((i+1)/(count+1))*height; el.style.height='32px'; el.style.top=`${y-16}px`; el.dataset.portId=port.id;});
      }
      place(inputs,type.inputs); place(outputs,type.outputs);
    }
    function markConnectedPorts(){
      for(const c of state.connections){
        portEl(c.from.node,c.from.port,'output')?.querySelector('.vc-port-pill')?.classList.add('vc-connected');
        portEl(c.to.node,c.to.port,'input')?.querySelector('.vc-port-pill')?.classList.add('vc-connected');
      }
    }
    function renderConnections(){
      connectionLayer.textContent='';

      for(const c of state.connections){
        const a=portPoint(c.from.node,c.from.port,'output');
        const b=portPoint(c.to.node,c.to.port,'input');

        if(!a||!b) continue;

        const active=
          state.selectedNode===c.from.node ||
          state.selectedNode===c.to.node;

        const p=svgEl('path',{d:curve(a,b)});
        p.classList.add('vc-connection');

        if(active){
          p.classList.add('vc-active');

          const activeNode=getNode(
            state.selectedNode===c.from.node
              ? c.from.node
              : c.to.node
          );

          const activeType=getNodeType(activeNode);

          if(activeType?.color){
            p.style.stroke=activeType.color;
          }
        }

        connectionLayer.appendChild(p);

        if(!active){
          connectionLayer.appendChild(
            svgEl('circle',{
              cx:a.x,
              cy:a.y,
              r:2.8,
              class:'vc-connection-dot'
            })
          );

          connectionLayer.appendChild(
            svgEl('circle',{
              cx:b.x,
              cy:b.y,
              r:2.8,
              class:'vc-connection-dot'
            })
          );
        }
      }

      if(state.connectionDrag) renderDragConnection();
    }
    function setNodeExpanded(el,expanded,immediate=false){
      const n=getNode(el?.dataset.nodeId);
      if(!el||!n)return;

      const body=el.querySelector('.vc-node-body');

      n.expanded=expanded;
      el.classList.toggle('vc-expanded',expanded);

      el.querySelector('.vc-node-toggle')?.setAttribute(
        'aria-expanded',
        String(expanded)
      );

      el.querySelector('.vc-node-toggle')?.setAttribute(
        'aria-label',
        expanded?'상세 내용 닫기':'상세 내용 열기'
      );

      positionPorts(el,getNodeType(n));

      const head=el.querySelector('.vc-node-head');
      const collapsedHeight=head.offsetHeight+20;

      if(immediate){
        body.style.transition='none';
        el.style.transition='none';

        if(expanded){
          body.style.height='auto';
          el.style.height='auto';
        }else{
          body.style.height='0px';
          el.style.height=`${collapsedHeight}px`;
        }

        positionPorts(el,getNodeType(n));

        raf(()=>{
          body.style.transition='';
          el.style.transition='';
          positionPorts(el,getNodeType(n));
          renderConnections();
        });

        return;
      }

      if(expanded){
        /*
          auto 상태에서 현재 실제 높이를 먼저 확보한 뒤
          목표 높이까지 애니메이션
        */
        body.style.height='0px';
        el.style.height=`${collapsedHeight}px`;

        const targetBody=body.scrollHeight;
        const targetHeight=collapsedHeight+targetBody;

        void el.offsetHeight;

        raf(()=>{
          body.style.height=`${targetBody}px`;
          el.style.height=`${targetHeight}px`;
          trackExpansion();

          setTimeout(()=>{
            if(n.expanded){
              body.style.height='auto';
              el.style.height='auto';
              positionPorts(el,getNodeType(n));
              renderConnections();
            }
          },360);
        });

        return;
      }

      /*
        접을 때는 현재 auto 높이를 실제 px 값으로 고정한 뒤
        0으로 애니메이션
      */
      const currentHeight=el.offsetHeight;
      const currentBodyHeight=body.scrollHeight;

      el.style.height=`${currentHeight}px`;
      body.style.height=`${currentBodyHeight}px`;

      void el.offsetHeight;

      raf(()=>{
        el.style.height=`${collapsedHeight}px`;
        body.style.height='0px';
        trackExpansion();
      });
    }
    function trackExpansion(){
      if(state.expansionAnimation)cancelAnimationFrame(state.expansionAnimation);
      const started=performance.now(),duration=340;
      const tick=now=>{renderConnections();if(now-started<duration){state.expansionAnimation=requestAnimationFrame(tick)}else{state.expansionAnimation=null;renderConnections()}};
      state.expansionAnimation=requestAnimationFrame(tick);
    }

    function uniqueId(prefix='n'){
      let id;
      do{id=`${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`}while(getNode(id));
      return id;
    }
    function normalizeNode(input){
      return {id:String(input.id||uniqueId()),type:String(input.type),x:Number(input.x)||0,y:Number(input.y)||0,expanded:!!input.expanded,data:structuredCloneSafe(input.data||{})};
    }
    function structuredCloneSafe(v){try{return structuredClone(v)}catch{return JSON.parse(JSON.stringify(v))}}

    function findNewNodePosition(){
      const rect=canvas.getBoundingClientRect();
      const mobile=window.innerWidth<=600;
      const nodeWidth=mobile?178:190;
      const marginScreen=28;
      const leftWorld=(marginScreen-state.offset.x)/state.scale;
      const topWorld=(marginScreen-state.offset.y)/state.scale;
      const rightWorld=(rect.width-marginScreen-nodeWidth*state.scale-state.offset.x)/state.scale;
      const bottomWorld=(rect.height-115-nodeWidth*0.4*state.scale-state.offset.y)/state.scale;
      const minX=Math.min(leftWorld,rightWorld),maxX=Math.max(leftWorld,rightWorld),minY=Math.min(topWorld,bottomWorld),maxY=Math.max(topWorld,bottomWorld);
      const centerX=(minX+maxX)/2,centerY=(minY+maxY)/2,gap=24;
      const estimatedHeight=54;
      const spots=[
        {x:centerX-nodeWidth/2,y:centerY-estimatedHeight/2},
        {x:centerX-nodeWidth/2,y:centerY-estimatedHeight/2+estimatedHeight+gap},
        {x:centerX-nodeWidth/2,y:centerY-estimatedHeight/2-estimatedHeight-gap},
        {x:centerX-nodeWidth/2-nodeWidth-gap,y:centerY-estimatedHeight/2},
        {x:centerX-nodeWidth/2+nodeWidth+gap,y:centerY-estimatedHeight/2},
        {x:minX,y:minY}
      ];
      const valid=spots.find(p=>{
        if(p.x<minX||p.x>maxX||p.y<minY||p.y>maxY)return false;
        return !state.nodes.some(n=>Math.abs(n.x-p.x)<nodeWidth+gap&&Math.abs(n.y-p.y)<estimatedHeight+gap);
      });
      return valid||{x:clamp(centerX-nodeWidth/2,minX,maxX),y:clamp(centerY-estimatedHeight/2,minY,maxY)};
    }

    function addNode(type,nodeData={}){
      if(!registry.has(type)) throw new Error(`Unknown node type: ${type}`);
      if(type==='start'){
        const existing=state.nodes.find(n=>n.type==='start');
        if(existing){selectNode(existing.id);closeAddMenu();return existing}
      }
      const p=nodeData.x!=null&&nodeData.y!=null?{x:nodeData.x,y:nodeData.y}:findNewNodePosition();
      const node=normalizeNode({id:nodeData.id||uniqueId(),type,x:p.x,y:p.y,expanded:true,data:nodeData.data});
      state.nodes.push(node);
      state.selectedNode=node.id;
      render();
      closeAddMenu();
      emit('change',getWorkflow());
      return node;
    }
    function removeNode(id){
      const node=getNode(id); if(!node||node.type==='start') return false;
      state.connections=state.connections.filter(c=>c.from.node!==id&&c.to.node!==id);
      const index=state.nodes.findIndex(n=>n.id===id); if(index<0)return false;
      state.nodes.splice(index,1);
      if(state.selectedNode===id)state.selectedNode=null;
      render(); emit('change',getWorkflow()); return true;
    }

    function setNodePosition(n,x,y){
      n.x=x;
      n.y=y;

      const el=getNodeElement(n.id);

      if(el){
        el.style.left=`${x}px`;
        el.style.top=`${y}px`;
      }

      renderConnections();
      emit('change',getWorkflow());
    }
    function selectNode(id){
      if(id!==null&&!getNode(id)) id=null;
      state.selectedNode=id;
      nodesLayer.querySelectorAll('.vc-node').forEach(el=>el.classList.toggle('vc-selected',el.dataset.nodeId===id));
      renderConnections();updateComposerState();emit('select',id);
    }
    function toggleNodeExpanded(id){const n=getNode(id),el=getNodeElement(id);if(!n||!el)return;setNodeExpanded(el,!n.expanded);selectNode(id);emit('change',getWorkflow())}

    function connectionValid(sourceNodeId,sourcePortId,targetNodeId,targetPortId){
      const errors=[],warnings=[];
      if(sourceNodeId===targetNodeId) errors.push({code:'SELF_CONNECTION',message:'노드는 자기 자신에게 연결할 수 없습니다.'});
      const source=getNode(sourceNodeId),target=getNode(targetNodeId);
      if(!source) errors.push({code:'MISSING_SOURCE_NODE',message:`출발 노드 ${sourceNodeId}가 존재하지 않습니다.`});
      if(!target) errors.push({code:'MISSING_TARGET_NODE',message:`대상 노드 ${targetNodeId}가 존재하지 않습니다.`});
      const out=portDef(sourceNodeId,sourcePortId,'output'),input=portDef(targetNodeId,targetPortId,'input');
      if(!out) errors.push({code:'MISSING_SOURCE_PORT',message:`출력 포트 ${sourcePortId}가 존재하지 않습니다.`});
      if(!input) errors.push({code:'MISSING_TARGET_PORT',message:`입력 포트 ${targetPortId}가 존재하지 않습니다.`});
      if(errors.length)return{ok:false,errors,warnings};
      const duplicate=state.connections.find(c=>c.from.node===sourceNodeId&&c.from.port===sourcePortId&&c.to.node===targetNodeId&&c.to.port===targetPortId);
      if(duplicate) errors.push({code:'DUPLICATE_CONNECTION',message:'동일한 연결이 이미 존재합니다.'});
      const incoming=state.connections.filter(c=>c.to.node===targetNodeId&&c.to.port===targetPortId);
      if(!input.multiple&&incoming.length) errors.push({code:'INPUT_MULTIPLE',message:`입력 포트 ${input.name}은 하나의 연결만 허용합니다.`});
      const accepted=input.accepts.includes('any')||input.accepts.includes(out.type)||out.type==='any';
      if(!accepted) errors.push({code:'TYPE_MISMATCH',message:`${out.type} → ${input.type} 타입을 연결할 수 없습니다.`});
      if(wouldCreateCycle(sourceNodeId,targetNodeId)) errors.push({code:'CYCLE',message:'이 연결은 순환 구조(Cycle)를 만듭니다.'});
      return{ok:errors.length===0,errors,warnings};
    }
    function wouldCreateCycle(fromId,toId){
      if(fromId===toId)return true;
      const adjacency=new Map();
      for(const c of state.connections){if(!adjacency.has(c.from.node))adjacency.set(c.from.node,[]);adjacency.get(c.from.node).push(c.to.node)}
      if(!adjacency.has(toId))return false;
      const stack=[toId],seen=new Set();
      while(stack.length){const cur=stack.pop();if(cur===fromId)return true;if(seen.has(cur))continue;seen.add(cur);for(const n of adjacency.get(cur)||[])stack.push(n)}
      return false;
    }
    function canConnect(spec){
      const result=connectionValid(spec.from.node,spec.from.port,spec.to.node,spec.to.port);
      emit('validate',result);return result;
    }
    function connect(from,to,options={}){
  const spec={from:{node:from.node,port:from.port},to:{node:to.node,port:to.port}};

  const duplicate=state.connections.find(c=>
    c.from.node===spec.from.node &&
    c.from.port===spec.from.port &&
    c.to.node===spec.to.node &&
    c.to.port===spec.to.port
  );

  if(duplicate){
    disconnect(duplicate.id);
    return null;
  }

  const check=canConnect(spec);
  if(!check.ok){
    showValidation(check.errors,check.warnings);
    return null;
  }

  const c={
    id:uniqueConnectionId(),
    from:spec.from,
    to:spec.to,
    ...(options.data?{data:structuredCloneSafe(options.data)}:{})
  };

  state.connections.push(c);
  render();
  emit('connect',c);
  emit('change',getWorkflow());
  return c;
}
    function uniqueConnectionId(){let id;do{id=`c${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`}while(state.connections.some(c=>c.id===id));return id}
    function disconnect(id){const i=state.connections.findIndex(c=>c.id===id);if(i<0)return false;state.connections.splice(i,1);render();emit('change',getWorkflow());return true}

    function validate(){
      const errors=[],warnings=[];
      const ids=new Set();
      for(const n of state.nodes){
        if(ids.has(n.id))errors.push({code:'DUPLICATE_NODE_ID',node:n.id,message:`노드 ID ${n.id}가 중복됩니다.`});ids.add(n.id);
        if(!registry.has(n.type))errors.push({code:'UNKNOWN_NODE_TYPE',node:n.id,message:`노드 타입 ${n.type}이 등록되어 있지 않습니다.`});
      }
      const nodeSet=new Set(state.nodes.map(n=>n.id));
      const connectionKeys=new Set();
      for(const c of state.connections){
        if(!nodeSet.has(c.from.node))errors.push({code:'MISSING_SOURCE_NODE',connection:c.id,message:`연결 ${c.id}의 출발 노드가 없습니다.`});
        if(!nodeSet.has(c.to.node))errors.push({code:'MISSING_TARGET_NODE',connection:c.id,message:`연결 ${c.id}의 대상 노드가 없습니다.`});
        if(c.from.node===c.to.node)errors.push({code:'SELF_CONNECTION',connection:c.id,message:`연결 ${c.id}가 자기 자신을 가리킵니다.`});
        const key=connectionKey(c);if(connectionKeys.has(key))errors.push({code:'DUPLICATE_CONNECTION',connection:c.id,message:`연결 ${c.id}가 중복됩니다.`});connectionKeys.add(key);
        const out=portDef(c.from.node,c.from.port,'output'),input=portDef(c.to.node,c.to.port,'input');
        if(!out)errors.push({code:'MISSING_SOURCE_PORT',connection:c.id,message:`연결 ${c.id}의 출력 포트가 없습니다.`});
        if(!input)errors.push({code:'MISSING_TARGET_PORT',connection:c.id,message:`연결 ${c.id}의 입력 포트가 없습니다.`});
        if(out&&input){if(!(input.accepts.includes('any')||input.accepts.includes(out.type)||out.type==='any'))errors.push({code:'TYPE_MISMATCH',connection:c.id,message:`${out.type} → ${input.type} 타입이 호환되지 않습니다.`})}
      }
      for(const n of state.nodes){
        const t=getNodeType(n);if(!t)continue;
        for(const p of t.inputs){const incoming=state.connections.filter(c=>c.to.node===n.id&&c.to.port===p.id);if(p.required&&!incoming.length)errors.push({code:'REQUIRED_INPUT',node:n.id,port:p.id,message:`${t.name}의 필수 입력 '${p.name}'이 연결되지 않았습니다.`});if(!p.multiple&&incoming.length>1)errors.push({code:'INPUT_MULTIPLE',node:n.id,port:p.id,message:`${t.name}의 '${p.name}'은 단일 입력만 허용합니다.`})}
      }
      const connectedNodes=new Set();for(const c of state.connections){connectedNodes.add(c.from.node);connectedNodes.add(c.to.node)}
      const startNodes=state.nodes.filter(n=>n.type==='start');
      for(const n of state.nodes){if(n.type!=='start'&&!connectedNodes.has(n.id))warnings.push({code:'ISOLATED_NODE',node:n.id,message:`노드 '${getNodeType(n)?.name||n.type}'가 그래프와 연결되지 않았습니다.`})}
      if(startNodes.length===0)warnings.push({code:'NO_START_NODE',message:'시작 노드가 없습니다.'});
      if(startNodes.length>1)warnings.push({code:'MULTIPLE_START_NODE',message:'시작 노드가 여러 개입니다.'});
      const graph={nodes:state.nodes.map(n=>n.id),adjacency:new Map()};for(const c of state.connections){if(!graph.adjacency.has(c.from.node))graph.adjacency.set(c.from.node,[]);graph.adjacency.get(c.from.node).push(c.to.node)}
      const cycleNodes=new Set();
      for(const nodeId of graph.nodes){const visiting=new Set(),visited=new Set();if(hasCycleFrom(nodeId,graph.adjacency,visiting,visited))cycleNodes.add(nodeId)}
      if(cycleNodes.size)errors.push({code:'CYCLE',nodes:[...cycleNodes],message:'워크플로우에 순환 구조(Cycle)가 존재합니다.'});
      const result={valid:errors.length===0,errors,warnings};emit('validate',result);return result;
    }
    function hasCycleFrom(node,adj,visiting,visited){if(visiting.has(node))return true;if(visited.has(node))return false;visiting.add(node);for(const next of adj.get(node)||[])if(hasCycleFrom(next,adj,visiting,visited))return true;visiting.delete(node);visited.add(node);return false}

    function getWorkflow(){return{nodes:structuredCloneSafe(state.nodes),connections:structuredCloneSafe(state.connections)}}
    function getState(){return{workflow:getWorkflow(),viewport:{scale:state.scale,offset:{...state.offset}}}}
    function setState(saved={}){
      const workflow=saved.workflow||saved;
      state.nodes=Array.isArray(workflow.nodes)?workflow.nodes.map(normalizeNode).filter(n=>registry.has(n.type)):[];
      state.connections=Array.isArray(workflow.connections)?structuredCloneSafe(workflow.connections).map(c=>({id:String(c.id||uniqueConnectionId()),from:{node:String(c.from?.node??c.from),port:String(c.from?.port??'out')},to:{node:String(c.to?.node??c.to),port:String(c.to?.port??'in')}})):[];
      if(saved.viewport){state.scale=clamp(Number(saved.viewport.scale)||1,.12,3);state.offset={x:Number(saved.viewport.offset?.x)||0,y:Number(saved.viewport.offset?.y)||0}}
      state.selectedNode=null;render();emit('change',getWorkflow());return api;
    }

    function showValidation(errors,warnings){
      validationLayer.textContent='';
      const items=[...errors.slice(0,3).map(x=>({cls:'vc-error',text:x.message})),...warnings.slice(0,2).map(x=>({cls:'vc-warning',text:x.message}))];
      if(!items.length)return;
      for(const item of items){const el=document.createElement('div');el.className=`vc-validation-item ${item.cls}`;el.textContent=item.text;validationLayer.appendChild(el);raf(()=>el.classList.add('vc-show'))}
      if(state.validationTimer)clearTimeout(state.validationTimer);state.validationTimer=setTimeout(()=>{validationLayer.querySelectorAll('.vc-validation-item').forEach(el=>el.classList.remove('vc-show'));setTimeout(()=>validationLayer.textContent='',200)},2800)
    }

    function render(){renderTransform();renderNodes();renderConnections();updateComposerState()}

    function renderMenu(){
      addMenu.textContent='';
      for(const [key,t] of registry){
        const b=document.createElement('button');b.type='button';b.className='vc-menu-item';b.dataset.nodeType=key;b.innerHTML=`
  <span
    class="vc-menu-icon"
    style="color:${t.color||'var(--sub)'}"
  >
    ${iconSvg[key]||''}
  </span>
  <span class="vc-menu-name">${escapeHtml(t.name)}</span>
  <span class="vc-menu-desc">${escapeHtml(t.tag)}</span>
`;addMenu.appendChild(b)
      }
    }

    focus.style.top=`${r.top-pad}px`;
    focus.style.width=`${r.width+pad*2}px`;
    focus.style.height=`${r.height+pad*2}px`;

    const cardWidth=card.offsetWidth;
    const cardHeight=card.offsetHeight;

    if(!cardWidth || !cardHeight){
      return true;
    }

    let x=r.left+(r.width-cardWidth)/2;
    let y=r.bottom+gap;

    if(
      y+cardHeight >
      window.innerHeight-14
    ){
      y=r.top-cardHeight-gap;
    }

    const maxX=Math.max(
      14,
      window.innerWidth-cardWidth-14
    );

    const maxY=Math.max(
      14,
      window.innerHeight-cardHeight-14
    );

    x=Math.min(
      Math.max(x,14),
      maxX
    );

    y=Math.min(
      Math.max(y,14),
      maxY
    );

    card.style.left=`${x}px`;
    card.style.top=`${y}px`;

    return true;
  }

  function positionLoop(){
    if(!running)return;

    const exists=updatePosition();

    if(!exists){
      finish();
      return;
    }

    rafId=requestAnimationFrame(positionLoop);
  }

  function restartPositionLoop(){
    stopPositionLoop();

    requestAnimationFrame(()=>{
      if(!running)return;

      updatePosition();
      positionLoop();
    });
  }

  function renderStep(){
    if(!running)return;

    const step=steps[index];

    if(!step){
      finish();
      return;
    }

    const target=document.querySelector(step.target);

    if(!target){
      if(index<steps.length-1){
        index++;
        renderStep();
      }else{
        finish();
      }

      return;
    }

    title.textContent=step.title;
    desc.textContent=step.desc;
    visual.innerHTML=step.visual;

    page.textContent=
      `${index+1} / ${steps.length}`;

    next.textContent=
      index===steps.length-1
        ? '시작하기'
        : '다음';

    restartPositionLoop();
  }

  function handleResize(){
    if(!running)return;

    requestAnimationFrame(()=>{
      updatePosition();
    });
  }

  next.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();

    if(!running)return;

    if(index===steps.length-1){
      finish();
      return;
    }

    index++;
    renderStep();
  });

  skip.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();

    finish();
  });

  layer.addEventListener('click',e=>{
    e.stopPropagation();
  });

  window.addEventListener('resize',handleResize);

  layer.classList.add('open');

  requestAnimationFrame(()=>{
    renderStep();
  });
}

setTimeout(playTutorial,500);
</script>
