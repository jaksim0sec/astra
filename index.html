<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<title>AI Visual Programming</title>

<style>
:root {
  color-scheme: light;

  --bg: #f5f5f3;
  --canvas: #f7f7f5;

  --glass: rgba(255,255,255,.72);
  --glass-strong: rgba(255,255,255,.90);

  --text: #202020;
  --text-sub: #777;
  --text-faint: #a5a5a5;

  --line: rgba(30,30,30,.19);
  --line-soft: rgba(30,30,30,.09);

  --node-bg: rgba(255,255,255,.73);
  --node-border: rgba(0,0,0,.095);

  --composer-bg: rgba(255,255,255,.80);

  --shadow:
    0 8px 28px rgba(0,0,0,.055),
    0 1px 2px rgba(0,0,0,.035);
}

html.dark {
  color-scheme: dark;

  --bg: #171717;
  --canvas: #181818;

  --glass: rgba(35,35,35,.70);
  --glass-strong: rgba(40,40,40,.92);

  --text: #f1f1f1;
  --text-sub: #999;
  --text-faint: #666;

  --line: rgba(255,255,255,.25);
  --line-soft: rgba(255,255,255,.09);

  --node-bg: rgba(35,35,35,.77);
  --node-border: rgba(255,255,255,.10);

  --composer-bg: rgba(34,34,34,.84);

  --shadow:
    0 12px 30px rgba(0,0,0,.25),
    0 1px 2px rgba(0,0,0,.18);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);
  background: var(--bg);
}

button,
textarea {
  font: inherit;
}

button {
  border: 0;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--canvas);
}


/* =========================================================
   CANVAS
========================================================= */

.canvas {
  position: absolute;
  inset: 0;

  overflow: hidden;

  touch-action: none;
  user-select: none;

  cursor: grab;
}

.canvas.dragging {
  cursor: grabbing;
}


/* =========================================================
   WORLD
========================================================= */

.world {
  position: absolute;

  left: 0;
  top: 0;

  width: 2000px;
  height: 2000px;

  transform-origin: 0 0;
}


/*
  연결선은 항상 노드 아래.
*/
.world-svg {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  overflow: visible;

  z-index: 1;

  pointer-events: none;
}

.nodes-layer {
  position: absolute;
  inset: 0;

  z-index: 10;
}


/* =========================================================
   NODE
========================================================= */

.node {
  position: absolute;

  width: 168px;
  min-height: 98px;

  padding: 15px 15px 13px;

  background: var(--node-bg);

  border: 1px solid var(--node-border);
  border-radius: 15px;

  box-shadow: var(--shadow);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  cursor: grab;

  transition:
    box-shadow .20s ease,
    border-color .20s ease,
    background .20s ease,
    transform .20s cubic-bezier(.22,.8,.25,1);
}

.node:hover {
  box-shadow:
    0 11px 32px rgba(0,0,0,.075),
    0 1px 2px rgba(0,0,0,.04);
}

.node.selected {
  border-color: var(--line);

  box-shadow:
    0 14px 34px rgba(0,0,0,.09),
    0 0 0 1px var(--line-soft);

  transform: translateY(-2px);
}

.node.dragging {
  cursor: grabbing;
  transition: none;
}

.node-title {
  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 14px;
  line-height: 1.25;

  font-weight: 650;
  letter-spacing: -.025em;
}

.node-icon {
  width: 20px;
  height: 20px;

  flex: 0 0 20px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 15px;
  line-height: 1;

  opacity: .88;
}

.node-name {
  min-width: 0;
}

.node-description {
  margin-top: 11px;

  color: var(--text-sub);

  font-size: 11.5px;
  line-height: 1.45;

  letter-spacing: -.015em;
}

.node-param {
  max-width: 100%;

  display: inline-flex;

  margin-top: 8px;
  padding: 4px 7px;

  border-radius: 7px;

  background: var(--line-soft);

  color: var(--text-sub);

  font-size: 10px;
  line-height: 1.25;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =========================================================
   PORT
========================================================= */

.port-hit {
  position: absolute;

  top: 50%;

  width: 30px;
  height: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  transform: translateY(-50%);

  z-index: 30;

  cursor: crosshair;
}

.port-hit.input {
  left: -15px;
}

.port-hit.output {
  right: -15px;
}


/*
  연결 힌트는 점 하나만.
  점선 테두리 없음.
*/
.port-pill {
  width: 9px;
  height: 9px;

  aspect-ratio: 1 / 1;

  border-radius: 50%;

  background: var(--text);

  opacity: .22;

  transition:
    opacity .17s ease,
    transform .17s cubic-bezier(.22,.8,.25,1);
}


/*
  선택된 노드의 포트는 solid.
*/
.node.selected .port-pill {
  opacity: .92;
  transform: scale(1.12);
}


/*
  이미 연결된 포트는 기본 상태에서 숨김.
*/
.port-pill.connected {
  opacity: 0;
}


/*
  선택하면 연결된 포트도 표시.
*/
.node.selected .port-pill.connected {
  opacity: .95;
}


/* =========================================================
   CONNECTION
========================================================= */

.connection {
  fill: none;

  stroke: var(--text);
  stroke-width: 1.8;

  stroke-linecap: round;
  stroke-linejoin: round;

  stroke-dasharray: 2.5 5;

  opacity: .20;

  pointer-events: none;

  transition:
    opacity .20s ease,
    stroke-width .20s ease,
    stroke-dasharray .20s ease;
}

.connection.active {
  stroke-dasharray: none;
  opacity: .62;
  stroke-width: 2;
}


/*
  실제 연결점.
*/
.connection-dot {
  fill: var(--canvas);

  stroke: var(--text);
  stroke-width: 1.3;

  opacity: .46;

  transition:
    opacity .18s ease,
    fill .18s ease,
    r .18s ease;
}

.connection-dot.active {
  fill: var(--text);
  opacity: .90;
}


/* =========================================================
   DRAG CONNECTION
========================================================= */

.drag-connection {
  fill: none;

  stroke: var(--text);
  stroke-width: 2;

  stroke-linecap: round;

  opacity: .80;

  pointer-events: none;
}

.drag-source-dot {
  fill: var(--text);
  opacity: .95;
}


/* =========================================================
   TOP CONTROLS
========================================================= */

.top-controls {
  position: fixed;

  top: max(14px, env(safe-area-inset-top));
  right: 14px;

  z-index: 100;

  display: flex;
  align-items: center;

  gap: 7px;
}

.top-button {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  cursor: pointer;

  transition:
    transform .18s cubic-bezier(.22,.8,.25,1),
    background .18s ease;
}

.top-button:active {
  transform: scale(.93);
}

.theme-button {
  color: var(--text);

  background: var(--glass);

  border: 1px solid var(--line-soft);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}


/*
  추가 버튼은 흰색 강조.
*/
.add-button {
  color: #181818;

  background: #fff;

  border: 1px solid rgba(0,0,0,.08);

  box-shadow:
    0 5px 16px rgba(0,0,0,.10);
}

html.dark .add-button {
  color: #171717;
  background: #f4f4f4;
}


/*
  + / × 아이콘.
*/
.add-icon {
  position: relative;

  width: 18px;
  height: 18px;

  display: block;

  transform: rotate(0deg);

  transition:
    transform .30s cubic-bezier(.22,.8,.25,1);
}

.add-icon::before,
.add-icon::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 14px;
  height: 1.5px;

  border-radius: 2px;

  background: currentColor;

  transform:
    translate(-50%, -50%);
}

.add-icon::after {
  transform:
    translate(-50%, -50%)
    rotate(90deg);
}


/*
  메뉴 활성화:
  +가 45도 회전하면서 ×.
*/
.add-button.open .add-icon {
  transform: rotate(45deg);
}


/* =========================================================
   ADD MENU
========================================================= */

.add-menu {
  position: fixed;

  top:
    calc(
      max(14px, env(safe-area-inset-top)) + 48px
    );

  right: 14px;

  z-index: 101;

  width: 205px;

  padding: 6px;

  border:
    1px solid var(--line-soft);

  border-radius: 15px;

  background: var(--glass-strong);

  box-shadow:
    0 14px 38px rgba(0,0,0,.10);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  opacity: 0;

  transform:
    translateY(-5px)
    scale(.98);

  pointer-events: none;

  transition:
    opacity .16s ease,
    transform .18s cubic-bezier(.22,.8,.25,1);
}

.add-menu.open {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.menu-item {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 9px;

  padding: 9px;

  border-radius: 9px;

  color: var(--text);

  background: transparent;

  text-align: left;

  cursor: pointer;

  transition:
    background .14s ease;
}

.menu-item:hover {
  background: var(--line-soft);
}

.menu-icon {
  width: 20px;

  display: inline-flex;
  justify-content: center;

  font-size: 14px;
}

.menu-name {
  font-size: 12px;
  font-weight: 550;
}


/* =========================================================
   CHAT COMPOSER
========================================================= */

.chat-composer-wrap {
  position: fixed;

  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));

  width:
    min(
      calc(100% - 28px),
      500px
    );

  transform: translateX(-50%);

  z-index: 200;

  pointer-events: none;
}

.chat-composer {
  pointer-events: auto;

  min-height: 46px;

  display: flex;
  align-items: center;

  gap: 2px;

  padding: 4px 5px;

  border:
    1px solid var(--line-soft);

  border-radius: 17px;

  background: var(--composer-bg);

  box-shadow:
    0 8px 28px rgba(0,0,0,.075);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.composer-button {
  width: 34px;
  height: 34px;

  flex: 0 0 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border-radius: 50%;

  color: var(--text-sub);

  background: transparent;

  cursor: pointer;

  transition:
    background .15s ease,
    color .15s ease,
    transform .15s cubic-bezier(.22,.8,.25,1);
}

.composer-button:hover {
  color: var(--text);
  background: var(--line-soft);
}

.composer-button:active {
  transform: scale(.92);
}

.attach-icon {
  font-size: 20px;
  font-weight: 300;
  line-height: 1;
}


/*
  입력 영역은 최대한 컴팩트.
*/
.chat-input {
  flex: 1;

  min-width: 0;

  min-height: 32px;
  max-height: 110px;

  resize: none;

  padding:
    6px
    3px;

  border: 0;
  outline: 0;

  color: var(--text);

  background: transparent;

  font-size: 13px;
  line-height: 1.45;

  letter-spacing: -.015em;
}

.chat-input::placeholder {
  color: var(--text-faint);
}


/*
  ChatGPT 계열의
  흰색 원형 보내기 버튼.
*/
.send-button {
  width: 34px;
  height: 34px;

  flex: 0 0 34px;

  color: #181818;

  background: #fff;

  border: 1px solid rgba(0,0,0,.07);

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

  transition:
    transform .16s cubic-bezier(.22,.8,.25,1),
    box-shadow .16s ease;
}

html.dark .send-button {
  color: #181818;
  background: #f4f4f4;
}

.send-button:hover {
  box-shadow:
    0 3px 10px rgba(0,0,0,.11);
}

.send-button:active {
  transform: scale(.90);
}

.send-button svg {
  width: 17px;
  height: 17px;

  display: block;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .node {
    width: 158px;
    min-height: 96px;

    padding:
      14px
      13px
      12px;

    border-radius: 14px;
  }

  .node-title {
    font-size: 13.5px;
  }

  .node-description {
    margin-top: 10px;
    font-size: 11px;
  }

  .top-controls {
    right: 11px;
  }

  .add-menu {
    right: 11px;
  }

  .chat-composer-wrap {
    width: calc(100% - 22px);

    bottom:
      max(
        9px,
        env(safe-area-inset-bottom)
      );
  }

  .chat-composer {
    min-height: 44px;

    padding: 4px;

    border-radius: 16px;
  }

  .composer-button,
  .send-button {
    width: 32px;
    height: 32px;

    flex-basis: 32px;
  }

  .chat-input {
    min-height: 32px;
    font-size: 13px;
  }

  .send-button svg {
    width: 16px;
    height: 16px;
  }
}
</style>
</head>


<body>

<div id="app">

  <!-- =====================================================
       CANVAS
  ====================================================== -->

  <div id="canvas" class="canvas">

    <div id="world" class="world">

      <svg
        id="connections"
        class="world-svg"
        viewBox="0 0 2000 2000"
        preserveAspectRatio="none"
      >

        <defs>

          <!--
            연결 드래그 중에만 사용되는 화살표.
          -->
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="5"
            markerHeight="5"
            orient="auto"
          >
            <path
              d="M 1 1 L 8 5 L 1 9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </marker>

        </defs>

        <g id="connectionLayer"></g>
        <g id="dragConnectionLayer"></g>

      </svg>


      <div
        id="nodesLayer"
        class="nodes-layer"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       TOP CONTROLS
  ====================================================== -->

  <div class="top-controls">

    <button
      id="themeButton"
      class="top-button theme-button"
      aria-label="다크 모드"
    >
      ◐
    </button>


    <button
      id="addButton"
      class="top-button add-button"
      aria-label="노드 추가"
      aria-expanded="false"
    >
      <span class="add-icon"></span>
    </button>

  </div>


  <!-- =====================================================
       ADD MENU
  ====================================================== -->

  <div
    id="addMenu"
    class="add-menu"
  ></div>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <div class="chat-composer-wrap">

    <form
      id="chatForm"
      class="chat-composer"
    >

      <button
        type="button"
        id="attachButton"
        class="composer-button"
        aria-label="파일 추가"
      >
        <span class="attach-icon">+</span>
      </button>


      <textarea
        id="chatInput"
        class="chat-input"
        rows="1"
        placeholder="무엇을 만들까요?"
      ></textarea>


      <button
        type="submit"
        class="composer-button send-button"
        aria-label="보내기"
      >

        <svg
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >

          <path
            d="M10 15.5V4.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M5.8 8.7L10 4.5L14.2 8.7"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </button>

    </form>

  </div>

</div>


<script>
/* =========================================================
   NODE TYPES
========================================================= */

const nodeTypes = {

  research: {
    icon: "⌕",
    name: "조사하기",
    description: "필요한 정보를 찾아 수집합니다.",
    param: "생성형 AI 시장의 최근 3년 변화"
  },

  organize: {
    icon: "≡",
    name: "정리하기",
    description: "자료를 기준에 따라 구조화합니다.",
    param: "시장 규모 / 주요 기업"
  },

  judge: {
    icon: "◌",
    name: "판단하기",
    description: "조건을 비교하고 결과를 판단합니다.",
    param: "일치도 ≥ 70%"
  },

  write: {
    icon: "↗",
    name: "작성하기",
    description: "주어진 정보를 문서 형태로 작성합니다.",
    param: "2페이지 보고서"
  },

  convert: {
    icon: "⇄",
    name: "변환하기",
    description: "자료의 형식이나 표현을 바꿉니다.",
    param: "요약 → 표"
  },

  file: {
    icon: "＋",
    name: "파일추가하기",
    description: "작업에 사용할 파일을 추가합니다.",
    param: "발표자료 원본"
  },

  createFile: {
    icon: "□",
    name: "파일만들기",
    description: "완성된 결과물을 파일로 생성합니다.",
    param: "PDF"
  }

};


/* =========================================================
   INITIAL DATA
========================================================= */

let nodes = [

  {
    id: "n1",
    type: "research",
    x: 780,
    y: 180
  },

  {
    id: "n2",
    type: "organize",
    x: 780,
    y: 350
  },

  {
    id: "n3",
    type: "write",
    x: 780,
    y: 520
  },

  {
    id: "n4",
    type: "createFile",
    x: 780,
    y: 690
  }

];


let connections = [

  {
    from: "n1",
    to: "n2"
  },

  {
    from: "n2",
    to: "n3"
  },

  {
    from: "n3",
    to: "n4"
  }

];


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("canvas");

const world =
  document.getElementById("world");

const nodesLayer =
  document.getElementById("nodesLayer");

const connectionLayer =
  document.getElementById("connectionLayer");

const dragConnectionLayer =
  document.getElementById(
    "dragConnectionLayer"
  );

const addButton =
  document.getElementById("addButton");

const addMenu =
  document.getElementById("addMenu");

const themeButton =
  document.getElementById("themeButton");

const chatForm =
  document.getElementById("chatForm");

const chatInput =
  document.getElementById("chatInput");


/* =========================================================
   STATE
========================================================= */

let selectedNodeId = null;

let scale = 1;

let offsetX = 0;
let offsetY = 0;

const MIN_SCALE = 0.02;


/*
  현재 화면에서 눌려 있는 pointer.
*/
const activePointers = new Map();


/*
  한 손가락 노드 이동.
*/
let nodeDrag = null;


/*
  한 손가락 빈 캔버스 이동.
*/
let canvasPan = null;


/*
  두 손가락 핀치.
*/
let pinch = null;


/*
  연결선 드래그.
*/
let connectionDrag = null;


/* =========================================================
   UTILS
========================================================= */

function clamp(
  value,
  min,
  max
) {
  return Math.min(
    max,
    Math.max(min, value)
  );
}


function distance(a, b) {

  return Math.hypot(
    b.x - a.x,
    b.y - a.y
  );

}


function midpoint(a, b) {

  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };

}


function getNode(id) {

  return nodes.find(
    node => node.id === id
  );

}


function getNodeElement(id) {

  return document.querySelector(
    `.node[data-id="${id}"]`
  );

}


function screenToWorld(
  x,
  y
) {

  return {

    x:
      (x - offsetX) /
      scale,

    y:
      (y - offsetY) /
      scale

  };

}


/* =========================================================
   WORLD
========================================================= */

function renderWorldTransform() {

  world.style.transform =
    `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

}


/* =========================================================
   NODES
========================================================= */

function renderNodes() {

  nodesLayer.innerHTML = "";


  for (
    const node
    of nodes
  ) {

    const type =
      nodeTypes[node.type];


    const el =
      document.createElement("div");


    el.className =
      "node" +
      (
        selectedNodeId === node.id
          ? " selected"
          : ""
      );


    el.dataset.id =
      node.id;


    el.style.left =
      `${node.x}px`;

    el.style.top =
      `${node.y}px`;


    el.innerHTML = `

      <div class="node-title">

        <span class="node-icon">
          ${type.icon}
        </span>

        <span class="node-name">
          ${type.name}
        </span>

      </div>


      <div class="node-description">
        ${type.description}
      </div>


      <div class="node-param">
        ${type.param}
      </div>


      <div
        class="port-hit input"
        data-port="input"
      >
        <span class="port-pill"></span>
      </div>


      <div
        class="port-hit output"
        data-port="output"
      >
        <span class="port-pill"></span>
      </div>

    `;


    const inputPort =
      el.querySelector(
        ".port-hit.input .port-pill"
      );


    const outputPort =
      el.querySelector(
        ".port-hit.output .port-pill"
      );


    if (
      connections.some(
        connection =>
          connection.to === node.id
      )
    ) {

      inputPort.classList.add(
        "connected"
      );

    }


    if (
      connections.some(
        connection =>
          connection.from === node.id
      )
    ) {

      outputPort.classList.add(
        "connected"
      );

    }


    nodesLayer.appendChild(el);

  }

}


/* =========================================================
   PORT GEOMETRY
========================================================= */

function getPortPoint(
  nodeId,
  direction
) {

  const node =
    getNode(nodeId);


  const el =
    getNodeElement(nodeId);


  if (!node || !el) {
    return null;
  }


  const width =
    el.offsetWidth;


  const height =
    el.offsetHeight;


  return {

    x:
      node.x +
      (
        direction === "output"
          ? width
          : 0
      ),

    y:
      node.y +
      height / 2

  };

}


/* =========================================================
   CONNECTION CURVE
========================================================= */

function curvePath(
  a,
  b
) {

  const dx =
    b.x - a.x;


  /*
    과도하게 휘지 않도록
    낮은 곡률.
  */
  const curve =
    clamp(
      Math.abs(dx) * .18,
      12,
      48
    );


  const direction =
    dx >= 0
      ? 1
      : -1;


  const c1 = {

    x:
      a.x +
      curve *
      direction,

    y:
      a.y

  };


  const c2 = {

    x:
      b.x -
      curve *
      direction,

    y:
      b.y

  };


  return `
    M ${a.x} ${a.y}
    C
      ${c1.x} ${c1.y},
      ${c2.x} ${c2.y},
      ${b.x} ${b.y}
  `;

}


/* =========================================================
   CONNECTION RENDER
========================================================= */

function renderConnections() {

  connectionLayer.innerHTML = "";


  for (
    const connection
    of connections
  ) {

    const from =
      getPortPoint(
        connection.from,
        "output"
      );


    const to =
      getPortPoint(
        connection.to,
        "input"
      );


    if (!from || !to) {
      continue;
    }


    const related =
      selectedNodeId ===
        connection.from ||
      selectedNodeId ===
        connection.to;


    /*
      실제 연결선.
      화살표 없음.
    */
    const path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    path.classList.add(
      "connection"
    );


    if (related) {
      path.classList.add(
        "active"
      );
    }


    path.setAttribute(
      "d",
      curvePath(
        from,
        to
      )
    );


    path.removeAttribute(
      "marker-end"
    );


    connectionLayer.appendChild(
      path
    );


    /*
      시작점.
    */
    const startDot =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );


    startDot.classList.add(
      "connection-dot"
    );


    if (related) {
      startDot.classList.add(
        "active"
      );
    }


    startDot.setAttribute(
      "cx",
      from.x
    );


    startDot.setAttribute(
      "cy",
      from.y
    );


    startDot.setAttribute(
      "r",
      related
        ? "3.5"
        : "3"
    );


    connectionLayer.appendChild(
      startDot
    );


    /*
      끝점.
    */
    const endDot =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );


    endDot.classList.add(
      "connection-dot"
    );


    if (related) {
      endDot.classList.add(
        "active"
      );
    }


    endDot.setAttribute(
      "cx",
      to.x
    );


    endDot.setAttribute(
      "cy",
      to.y
    );


    endDot.setAttribute(
      "r",
      related
        ? "3.5"
        : "3"
    );


    connectionLayer.appendChild(
      endDot
    );

  }

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  renderWorldTransform();

  renderNodes();

  renderConnections();

}


/* =========================================================
   SELECT
========================================================= */

function selectNode(id) {

  selectedNodeId =
    id;

  renderNodes();

  renderConnections();

/* =========================================================
   NODE POSITION
========================================================= */

function setNodePosition(
  node,
  x,
  y
) {

  node.x = x;
  node.y = y;


  const el =
    getNodeElement(
      node.id
    );


  if (!el) {
    return;
  }


  el.style.left =
    `${x}px`;

  el.style.top =
    `${y}px`;


  renderConnections();

}


/* =========================================================
   NEW NODE POSITION
========================================================= */

function findNewNodePosition() {

  const centerX =
    780;


  const baseY =
    180 +
    nodes.length *
    165;


  /*
    세로 배치를 최우선.
  */
  const candidates = [

    {
      x: centerX,
      y: baseY
    },

    {
      x: centerX,
      y: baseY - 170
    },

    {
      x: centerX,
      y: baseY + 170
    },

    {
      x: centerX - 210,
      y: baseY
    },

    {
      x: centerX + 210,
      y: baseY
    },

    {
      x: centerX - 210,
      y: baseY - 170
    },

    {
      x: centerX + 210,
      y: baseY - 170
    }

  ];


  for (
    const candidate
    of candidates
  ) {

    const collision =
      nodes.some(
        node =>

          Math.abs(
            node.x -
            candidate.x
          ) < 180 &&

          Math.abs(
            node.y -
            candidate.y
          ) < 125
      );


    if (!collision) {
      return candidate;
    }

  }


  return {

    x: centerX,

    y:
      baseY +
      340

  };

}

/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    /*
      모든 pointer를 가장 먼저 등록.
    */
    activePointers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY
      }
    );


    /*
      =====================================================
      TWO FINGER
      =====================================================
    */

    if (
      activePointers.size >= 2
    ) {

      /*
        기존 노드 이동을 즉시 취소.
      */
      if (nodeDrag) {

        const nodeEl =
          getNodeElement(
            nodeDrag.node.id
          );


        nodeEl?.classList.remove(
          "dragging"
        );

      }


      nodeDrag = null;

      canvasPan = null;


      const points =
        [...activePointers.values()];


      const center =
        midpoint(
          points[0],
          points[1]
        );


      /*
        핀치 시작 중심을
        월드 좌표로 고정.
      */
      const anchor =
        screenToWorld(
          center.x,
          center.y
        );


      pinch = {

        startDistance:
          distance(
            points[0],
            points[1]
          ),

        startScale:
          scale,

        anchorWorldX:
          anchor.x,

        anchorWorldY:
          anchor.y

      };


      return;
    }


    /*
      =====================================================
      CONNECTION PORT
      =====================================================
    */

    const port =
      e.target.closest(
        ".port-hit"
      );


    if (port) {

      const nodeEl =
        port.closest(".node");


      if (!nodeEl) {
        return;
      }


      const node =
        getNode(
          nodeEl.dataset.id
        );


      if (!node) {
        return;
      }


      const direction =
        port.dataset.port;


      /*
        output에서만 연결 드래그.
      */
      if (
        direction === "output"
      ) {

        connectionDrag = {

          pointerId:
            e.pointerId,

          from:
            node.id,

          x:
            e.clientX,

          y:
            e.clientY

        };


        renderDragConnection();

        return;

      }


      return;
    }


    /*
      =====================================================
      NODE
      =====================================================
    */

    const nodeEl =
      e.target.closest(
        ".node"
      );


    if (nodeEl) {

      const node =
        getNode(
          nodeEl.dataset.id
        );


      if (!node) {
        return;
      }


      selectNode(
        node.id
      );


      nodeDrag = {

        pointerId:
          e.pointerId,

        node,

        startX:
          e.clientX,

        startY:
          e.clientY,

        nodeX:
          node.x,

        nodeY:
          node.y

      };


      nodeEl.classList.add(
        "dragging"
      );


      try {

        canvas.setPointerCapture(
          e.pointerId
        );

      } catch {}


      return;
    }


    /*
      =====================================================
      EMPTY CANVAS
      =====================================================
    */

    selectNode(null);


    canvasPan = {

      pointerId:
        e.pointerId,

      startX:
        e.clientX,

      startY:
        e.clientY,

      startOffsetX:
        offsetX,

      startOffsetY:
        offsetY

    };


    canvas.classList.add(
      "dragging"
    );


    try {

      canvas.setPointerCapture(
        e.pointerId
      );

    } catch {}

  }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
  "pointermove",
  e => {

    if (
      !activePointers.has(
        e.pointerId
      )
    ) {
      return;
    }


    activePointers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY
      }
    );


    /*
      =====================================================
      TWO FINGER
      =====================================================

      반드시 모든 단일 제스처보다 먼저 처리.
    */
    if (
      activePointers.size >= 2
    ) {

      nodeDrag = null;
      canvasPan = null;


      const points =
        [...activePointers.values()];


      if (!pinch) {

        const center =
          midpoint(
            points[0],
            points[1]
          );


        const anchor =
          screenToWorld(
            center.x,
            center.y
          );


        pinch = {

          startDistance:
            distance(
              points[0],
              points[1]
            ),

          startScale:
            scale,

          anchorWorldX:
            anchor.x,

          anchorWorldY:
            anchor.y

        };

      }


      const currentDistance =
        distance(
          points[0],
          points[1]
        );


      if (
        pinch.startDistance <= 0
      ) {
        return;
      }


      const ratio =
        currentDistance /
        pinch.startDistance;


      scale =
        Math.max(
          MIN_SCALE,
          pinch.startScale *
          ratio
        );


      /*
        현재 두 손가락 중심.
      */
      const center =
        midpoint(
          points[0],
          points[1]
        );


      /*
        핀치 시작 때 잡은 월드 지점을
        현재 손가락 중심에 유지.
      */
      offsetX =
        center.x -
        pinch.anchorWorldX *
        scale;


      offsetY =
        center.y -
        pinch.anchorWorldY *
        scale;


      renderWorldTransform();

      renderConnections();

      return;
    }


    /*
      =====================================================
      CONNECTION DRAG
      =====================================================
    */

    if (
      connectionDrag &&
      connectionDrag.pointerId ===
        e.pointerId
    ) {

      connectionDrag.x =
        e.clientX;

      connectionDrag.y =
        e.clientY;


      renderDragConnection();

      return;
    }


    /*
      =====================================================
      NODE DRAG
      =====================================================
    */

    if (
      nodeDrag &&
      nodeDrag.pointerId ===
        e.pointerId
    ) {

      const dx =
        (
          e.clientX -
          nodeDrag.startX
        ) / scale;


      const dy =
        (
          e.clientY -
          nodeDrag.startY
        ) / scale;


      setNodePosition(

        nodeDrag.node,

        nodeDrag.nodeX +
          dx,

        nodeDrag.nodeY +
          dy

      );


      return;
    }


    /*
      =====================================================
      CANVAS PAN
      =====================================================
    */

    if (
      canvasPan &&
      canvasPan.pointerId ===
        e.pointerId
    ) {

      offsetX =
        canvasPan.startOffsetX +
        (
          e.clientX -
          canvasPan.startX
        );


      offsetY =
        canvasPan.startOffsetY +
        (
          e.clientY -
          canvasPan.startY
        );


      renderWorldTransform();

      return;
    }

  }
);


/* =========================================================
   POINTER END
========================================================= */

function endPointer(e) {

  /*
    연결 드래그가 끝나면
    성공/실패와 상관없이 먼저 정리.
  */
  if (
    connectionDrag &&
    connectionDrag.pointerId ===
      e.pointerId
  ) {

    finishConnectionDrag(e);

  }


  activePointers.delete(
    e.pointerId
  );


  /*
    두 손가락 상태 종료.
  */
  if (
    activePointers.size < 2
  ) {

    pinch = null;

  }


  /*
    모든 pointer가 끝났을 때
    단일 제스처 상태도 종료.
  */
  if (
    activePointers.size === 0
  ) {

    if (nodeDrag) {

      const nodeEl =
        getNodeElement(
          nodeDrag.node.id
        );


      nodeEl?.classList.remove(
        "dragging"
      );

    }


    nodeDrag = null;

    canvasPan = null;

    pinch = null;

    connectionDrag = null;


    canvas.classList.remove(
      "dragging"
    );

  }

}


canvas.addEventListener(
  "pointerup",
  endPointer
);


canvas.addEventListener(
  "pointercancel",
  endPointer
);


/* =========================================================
   CONNECTION DRAG
========================================================= */

function renderDragConnection() {

  dragConnectionLayer.innerHTML = "";


  if (!connectionDrag) {
    return;
  }


  const start =
    getPortPoint(
      connectionDrag.from,
      "output"
    );


  if (!start) {
    return;
  }


  const target =
    screenToWorld(
      connectionDrag.x,
      connectionDrag.y
    );


  /*
    임시 연결선.
  */
  const path =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );


  path.classList.add(
    "drag-connection"
  );


  path.setAttribute(
    "d",
    curvePath(
      start,
      target
    )
  );


  /*
    화살표는 오직 이때만.
  */
  path.setAttribute(
    "marker-end",
    "url(#arrow)"
  );


  dragConnectionLayer.appendChild(
    path
  );


  /*
    시작점.
  */
  const dot =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );


  dot.classList.add(
    "drag-source-dot"
  );


  dot.setAttribute(
    "cx",
    start.x
  );


  dot.setAttribute(
    "cy",
    start.y
  );


  dot.setAttribute(
    "r",
    "4"
  );


  dragConnectionLayer.appendChild(
    dot
  );

}


/* =========================================================
   FINISH CONNECTION
========================================================= */

function finishConnectionDrag(e) {

  /*
    임시 선을 무조건 제거.
    허공에 놓아도 절대 남지 않는다.
  */
  dragConnectionLayer.innerHTML = "";


  if (!connectionDrag) {
    return;
  }


  const source =
    connectionDrag.from;


  const targetElement =
    document.elementFromPoint(
      e.clientX,
      e.clientY
    );


  const targetPort =
    targetElement?.closest(
      ".port-hit.input"
    );


  if (targetPort) {

    const targetNode =
      targetPort.closest(
        ".node"
      );


    const targetId =
      targetNode?.dataset.id;


    if (
      targetId &&
      targetId !== source
    ) {

      const exists =
        connections.some(
          connection =>

            connection.from ===
              source &&

            connection.to ===
              targetId
        );


      if (!exists) {

        connections.push({

          from:
            source,

          to:
            targetId

        });

      }

    }

  }


  connectionDrag = null;

  dragConnectionLayer.innerHTML = "";

  render();

}


/* =========================================================
   WHEEL ZOOM
========================================================= */

canvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();


    /*
      커서 아래 월드 좌표를 기억.
    */
    const before =
      screenToWorld(
        e.clientX,
        e.clientY
      );


    const factor =
      Math.exp(
        -e.deltaY *
        .0015
      );


    scale =
      Math.max(
        MIN_SCALE,
        scale *
        factor
      );


    /*
      커서가 계속 같은 월드 위치를 보도록.
    */
    offsetX =
      e.clientX -
      before.x *
      scale;


    offsetY =
      e.clientY -
      before.y *
      scale;


    renderWorldTransform();

    renderConnections();

  },
  {
    passive: false
  }
);

/* =========================================================
   INITIAL VIEW
========================================================= */

function centerInitialWorld() {

  const first =
    nodes[0];


  if (!first) {
    return;
  }


  const rect =
    canvas.getBoundingClientRect();


  const nodeWidth =
    168;


  offsetX =
    rect.width / 2 -
    (
      first.x +
      nodeWidth / 2
    ) *
    scale;


  offsetY =
    90 -
    first.y *
    scale;

}


centerInitialWorld();

render();

</script>
