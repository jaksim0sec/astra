<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<title>AI Visual Programming</title>

<style>
:root{
  color-scheme:light;
  --bg:#f3f3f1;
  --canvas:#f7f7f5;
  --glass:rgba(255,255,255,.72);
  --glass2:rgba(255,255,255,.9);
  --text:#202020;
  --sub:#777;
  --faint:#aaa;
  --line:rgba(25,25,25,.18);
  --soft:rgba(25,25,25,.07);
  --node:rgba(255,255,255,.78);
  --border:rgba(0,0,0,.09);
  --accent:#6b4cff;
  --accent-soft:rgba(107,76,255,.11);
  --danger:#e5484d;
  --danger-soft:rgba(229,72,77,.1);
  --shadow:
    0 12px 34px rgba(0,0,0,.07),
    0 1px 2px rgba(0,0,0,.035);
}

html.dark{
  color-scheme:dark;
  --bg:#141414;
  --canvas:#171717;
  --glass:rgba(32,32,32,.72);
  --glass2:rgba(38,38,38,.94);
  --text:#f1f1f1;
  --sub:#999;
  --faint:#666;
  --line:rgba(255,255,255,.22);
  --soft:rgba(255,255,255,.075);
  --node:rgba(34,34,34,.84);
  --border:rgba(255,255,255,.1);
  --accent:#8b73ff;
  --accent-soft:rgba(139,115,255,.15);
  --danger:#ff6b72;
  --danger-soft:rgba(255,107,114,.12);
  --shadow:
    0 15px 36px rgba(0,0,0,.28),
    0 1px 2px rgba(0,0,0,.18);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,
textarea{
  font:inherit;
}

button{
  border:0;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:var(--canvas);
}

.canvas{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
}

.canvas.dragging{
  cursor:grabbing;
}

.world{
  position:absolute;
  left:0;
  top:0;
  width:3000px;
  height:3000px;
  transform-origin:0 0;
}

.world:before{
  content:"";
  position:absolute;
  inset:-1000px;
  background-image:
    radial-gradient(
      circle,
      var(--soft) 1px,
      transparent 1px
    );
  background-size:28px 28px;
  opacity:.65;
  pointer-events:none;
}

.world-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  z-index:1;
  pointer-events:none;
}

.nodes-layer{
  position:absolute;
  inset:0;
  z-index:10;
}

.node{
  position:absolute;

  width:190px;
  min-height:50px;
  height:50px;

  padding:10px 12px;

  background:var(--node);
  border:1px solid var(--border);
  border-radius:15px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  cursor:grab;
  overflow:visible;

  transition:
    height .32s cubic-bezier(.22,.8,.25,1),
    box-shadow .18s ease,
    border-color .18s ease,
    background .18s ease,
    transform .18s cubic-bezier(.22,.8,.25,1);
}

.node:hover{
  box-shadow:
    0 15px 38px rgba(0,0,0,.09),
    0 1px 2px rgba(0,0,0,.04);
}

.node.selected,
.node.expanded{
  border-color:
    color-mix(
      in srgb,
      var(--accent) 48%,
      transparent
    );

  box-shadow:
    0 16px 40px rgba(0,0,0,.11),
    0 0 0 3px var(--accent-soft);

  transform:translateY(-2px);
}

.node.dragging{
  cursor:grabbing;
  transition:none;
}

/* =========================
   NODE HEAD
========================= */

.node-head{
  height:28px;

  display:flex;
  align-items:center;
  gap:9px;
}

.node-icon{
  position:relative;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      var(--soft),
      color-mix(
        in srgb,
        var(--soft) 45%,
        transparent
      )
    );

  border:
    1px solid
    color-mix(
      in srgb,
      var(--text) 7%,
      transparent
    );

  color:var(--sub);

  flex:0 0 28px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 2px 6px rgba(0,0,0,.035);
}

.node-icon svg{
  width:15px;
  height:15px;
  display:block;
}

.node.selected .node-icon,
.node.expanded .node-icon{
  background:var(--accent-soft);

  border-color:
    color-mix(
      in srgb,
      var(--accent) 22%,
      transparent
    );

  color:var(--accent);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 4px 12px
      color-mix(
        in srgb,
        var(--accent) 13%,
        transparent
      );
}

.node-title{
  min-width:0;
  flex:1;

  font-size:13px;
  font-weight:700;
  letter-spacing:-.025em;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   NODE ACTIONS
========================= */

.node-actions{
  display:flex;
  align-items:center;
  gap:3px;
  flex:0 0 auto;
}

.node-action{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:9px;

  color:var(--sub);
  background:transparent;

  cursor:pointer;

  transition:
    background .18s ease,
    color .18s ease,
    transform .18s cubic-bezier(.22,.8,.25,1);
}

.node-action:hover{
  background:var(--soft);
  color:var(--text);
}

.node-action:active{
  transform:scale(.88);
}

.node-action svg{
  width:14px;
  height:14px;
  display:block;
}

/* 일반 노드에서만 헤더 삭제 버튼 표시 */
.node-delete{
  display:none;
}

.node:not(.start-node).expanded .node-delete{
  display:flex;
}

.node-delete:hover{
  color:var(--danger);
  background:var(--danger-soft);
}

.node-toggle{
  color:var(--sub);
}

.node.expanded .node-toggle{
  color:var(--accent);
  background:var(--accent-soft);
}

.node-toggle svg{
  transition:
    transform .32s cubic-bezier(.22,.8,.25,1);
}

.node.expanded .node-toggle svg{
  transform:rotate(180deg);
}

/* =========================
   START NODE
========================= */

.node.start-node{
  border-color:
    color-mix(
      in srgb,
      var(--accent) 20%,
      var(--border)
    );

  background:
    linear-gradient(
      145deg,
      color-mix(
        in srgb,
        var(--accent-soft) 65%,
        var(--node)
      ),
      var(--node)
    );
}

.node.start-node .node-icon{
  color:var(--accent);

  background:var(--accent-soft);

  border-color:
    color-mix(
      in srgb,
      var(--accent) 22%,
      transparent
    );
}

.start-badge{
  flex:none;

  padding:3px 6px;

  border-radius:999px;

  color:var(--accent);

  background:var(--accent-soft);

  font-size:8px;
  font-weight:800;
  letter-spacing:.03em;
}

/* =========================
   NODE BODY
========================= */

.node-body{
  height:0;
  overflow:hidden;
  opacity:0;

  transition:
    height .32s cubic-bezier(.22,.8,.25,1),
    opacity .18s ease;
}

.node.expanded .node-body{
  opacity:1;
}

.node-description{
  margin-top:11px;

  color:var(--sub);

  font-size:11px;
  line-height:1.5;
  letter-spacing:-.015em;
}

.node-param{
  display:flex;
  align-items:center;
  gap:5px;

  max-width:100%;

  margin-top:9px;
  padding:5px 8px;

  border-radius:9px;

  background:var(--soft);
  color:var(--sub);

  font-size:10px;
  line-height:1.25;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.node-delete-row{
  margin-top:9px;
  padding-top:1px;
}

.node-delete-button{
  width:100%;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  border-radius:9px;

  color:var(--danger);
  background:var(--danger-soft);

  font-size:10px;
  font-weight:650;

  cursor:pointer;

  transition:
    background .18s ease,
    transform .18s cubic-bezier(.22,.8,.25,1);
}

.node-delete-button:hover{
  background:
    color-mix(
      in srgb,
      var(--danger-soft) 70%,
      var(--danger) 8%
    );
}

.node-delete-button:active{
  transform:scale(.97);
}

.node-delete-button svg{
  width:13px;
  height:13px;
  display:block;
}

.node-param:before{
  content:"";

  width:4px;
  height:4px;

  border-radius:50%;

  background:currentColor;
  opacity:.45;

  flex:none;
}

/* =========================
   PORT
========================= */

.port-hit{
  position:absolute;

  top:50%;

  width:52px;
  height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  transform:translateY(-50%);

  z-index:40;

  cursor:crosshair;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.port-hit.input{
  left:-26px;
}

.port-hit.output{
  right:-26px;
}

.port-pill{
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--canvas);

  border:
    1.5px solid
    var(--text);

  opacity:.18;

  transition:
    opacity .15s ease,
    transform .15s cubic-bezier(.22,.8,.25,1),
    background .15s ease,
    border-color .15s ease;
}

.node.selected .port-pill,
.node.expanded .port-pill{
  opacity:.9;
  transform:scale(1.05);
}

.port-pill.connected{
  background:var(--text);
  opacity:.35;
}

.node.selected .port-pill.connected,
.node.expanded .port-pill.connected{
  opacity:1;
}

.port-hit:hover .port-pill{
  opacity:1;

  transform:scale(1.25);

  background:var(--accent);
  border-color:var(--accent);
}

.start-node .port-hit.input{
  display:none;
}

/* =========================
   CONNECTION
========================= */

.connection{
  fill:none;

  stroke:var(--text);
  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;

  stroke-dasharray:2 5;

  opacity:.18;

  pointer-events:none;

  transition:
    opacity .18s ease,
    stroke-width .18s ease,
    stroke .18s ease;
}

.connection.active{
  stroke:var(--accent);

  stroke-dasharray:none;

  opacity:.7;
  stroke-width:2.2;
}

.connection-dot{
  fill:var(--canvas);

  stroke:var(--text);
  stroke-width:1.2;

  opacity:.35;
}

.drag-connection{
  fill:none;

  stroke:var(--accent);
  stroke-width:2.2;

  stroke-linecap:round;

  opacity:.85;

  pointer-events:none;
}

.drag-source-dot{
  fill:var(--accent);
}

/* =========================
   TOP
========================= */

.top-controls{
  position:fixed;

  top:max(14px,env(safe-area-inset-top));
  right:14px;

  z-index:100;

  display:flex;
  gap:7px;
}

.top-button{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  cursor:pointer;

  transition:
    transform .18s cubic-bezier(.22,.8,.25,1),
    background .18s ease;
}

.top-button:active{
  transform:scale(.93);
}

.theme-button{
  color:var(--text);

  background:var(--glass);

  border:1px solid var(--soft);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.add-button{
  color:#171717;

  background:#fff;

  border:
    1px solid
    rgba(0,0,0,.07);

  box-shadow:
    0 6px 18px rgba(0,0,0,.1);
}

html.dark .add-button{
  background:#f4f4f4;
}

.add-node-icon{
  width:19px;
  height:19px;

  display:block;

  transition:
    transform .28s cubic-bezier(.22,.8,.25,1),
    opacity .18s ease;
}

.add-button:hover .add-node-icon{
  transform:scale(1.04);
}

.add-button.open .add-node-icon{
  transform:
    rotate(90deg)
    scale(.96);
}

.add-menu{
  position:fixed;

  top:
    calc(
      max(14px,env(safe-area-inset-top))
      + 48px
    );

  right:14px;

  z-index:101;

  width:218px;

  padding:6px;

  border:
    1px solid
    var(--soft);

  border-radius:16px;

  background:var(--glass2);

  box-shadow:
    0 16px 42px rgba(0,0,0,.12);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  opacity:0;

  transform:
    translateY(-5px)
    scale(.98);

  pointer-events:none;

  transition:
    opacity .16s ease,
    transform .18s cubic-bezier(.22,.8,.25,1);
}

.add-menu.open{
  opacity:1;

  transform:none;

  pointer-events:auto;
}

.menu-item{
  width:100%;

  display:flex;
  align-items:center;

  gap:10px;

  padding:9px;

  border-radius:10px;

  color:var(--text);
  background:transparent;

  text-align:left;

  cursor:pointer;
}

.menu-item:hover{
  background:var(--soft);
}

.menu-icon{
  width:26px;
  height:26px;

  flex:0 0 26px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:var(--soft);

  border:
    1px solid
    color-mix(
      in srgb,
      var(--text) 6%,
      transparent
    );

  color:var(--sub);
}

.menu-icon svg{
  width:15px;
  height:15px;
  display:block;
}

.menu-name{
  font-size:11.5px;
  font-weight:600;
}

.menu-desc{
  margin-left:auto;

  color:var(--faint);

  font-size:9px;
}

/* =========================
   COMPOSER
========================= */

.chat-composer-wrap{
  position:fixed;

  left:50%;
  right:auto;

  bottom:
    max(
      18px,
      calc(
        env(safe-area-inset-bottom) + 8px
      )
    );

  width:min(
    calc(100% - 28px),
    540px
  );

  transform:translateX(-50%);

  z-index:200;

  pointer-events:none;
}

.chat-composer{
  position:relative;

  left:50%;

  transform:translateX(-50%);

  pointer-events:auto;

  width:100%;
  min-height:48px;

  display:flex;
  align-items:center;

  gap:4px;

  padding:5px;

  border:
    1px solid
    var(--soft);

  border-radius:26px;

  background:var(--glass2);

  box-shadow:
    0 10px 32px rgba(0,0,0,.09),
    0 1px 2px rgba(0,0,0,.04);

  backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);

  transition:
    width .28s cubic-bezier(.22,.8,.25,1),
    min-height .22s ease,
    padding .22s ease,
    border-radius .22s ease,
    box-shadow .22s ease,
    opacity .22s ease;
}

.chat-composer:not(.is-active){
  width:320px;

  min-height:42px;

  padding:3px 4px;

  border-radius:22px;

  opacity:.86;
}

.chat-composer:not(.is-active) .chat-input{
  min-height:32px;

  padding-top:6px;
  padding-bottom:6px;

  font-size:15.5px;
  font-weight:500;
}

.chat-composer.has-text,
.chat-composer:focus-within,
.chat-composer.is-active{
  min-height:54px;

  padding:7px;

  border-radius:28px;

  opacity:1;
}

.composer-button{
  width:36px;
  height:36px;

  flex:0 0 36px;

  align-self:center;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  color:var(--sub);
  background:transparent;

  cursor:pointer;
}

.composer-button:hover{
  color:var(--text);
  background:var(--soft);
}

.composer-button:active{
  transform:scale(.92);
}

.attach-icon{
  width:17px;
  height:17px;

  display:block;
}

.chat-input{
  flex:1;

  min-width:0;

  min-height:38px;
  max-height:115px;

  resize:none;

  padding:
    8px
    6px
    7px;

  border:0;
  outline:0;

  color:var(--text);
  background:transparent;

  font-size:15px;
  line-height:1.45;

  letter-spacing:-.015em;
}

.chat-input::placeholder{
  color:var(--faint);
}

.send-button{
  width:32px;
  height:32px;

  flex:0 0 32px;

  align-self:center;

  padding:0;

  border-radius:50% !important;

  color:#171717;
  background:#fff;

  border:
    1px solid
    rgba(0,0,0,.07);

  box-shadow:
    0 3px 9px rgba(0,0,0,.09),
    inset 0 1px 0 rgba(255,255,255,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  line-height:0;
}

.send-button svg{
  width:15px;
  height:15px;

  display:block;
}

.send-button:active{
  transform:scale(.93);
}

html.dark .send-button{
  background:#f4f4f4;
}

.zoom-indicator{
  position:fixed;

  left:14px;

  top:max(14px,env(safe-area-inset-top));

  z-index:90;

  padding:7px 10px;

  border-radius:10px;

  background:var(--glass);

  border:1px solid var(--soft);

  color:var(--sub);

  font-size:10px;

  backdrop-filter:blur(18px);

  opacity:.8;
}

@media(max-width:600px){

  .node{
    width:178px;

    min-height:48px;
    height:48px;

    padding:10px 12px;

    border-radius:16px;
  }

  .node-title{
    font-size:12.5px;
  }

  .node-description{
    font-size:10.5px;
  }

  .start-badge{
    font-size:7.5px;
    padding:3px 5px;
  }

  .top-controls{
    right:11px;
  }

  .add-menu{
    right:11px;
  }

  .chat-composer-wrap{
    left:50%;
    right:auto;

    width:
      calc(
        100% -
        22px
      );

    bottom:
      max(
        17px,
        calc(
          env(safe-area-inset-bottom) + 8px
        )
      );

    transform:translateX(-50%);
  }

  .chat-composer{
    left:50%;

    transform:translateX(-50%);

    min-height:47px;

    border-radius:24px;

    padding:4px;
  }

  .chat-composer:not(.is-active){
    width:275px;

    min-height:40px;

    border-radius:21px;

    padding:3px 4px;
  }

  .chat-composer:not(.is-active) .chat-input{
    min-height:31px;
    font-size:15px;
  }

  .chat-composer.has-text,
  .chat-composer:focus-within,
  .chat-composer.is-active{
    min-height:52px;

    border-radius:27px;

    padding:6px;
  }

  .composer-button{
    width:34px;
    height:34px;

    flex-basis:34px;
  }

  .send-button{
    width:30px;
    height:30px;

    flex-basis:30px;

    border-radius:50% !important;
  }

  .zoom-indicator{
    left:11px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="canvas" class="canvas">

    <div id="world" class="world">

      <svg
        id="connections"
        class="world-svg"
        viewBox="0 0 3000 3000"
        preserveAspectRatio="none"
      >

        <defs>

          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="5"
            markerHeight="5"
            orient="auto"
          >
            <path
              d="M1 1L8 5L1 9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </marker>

        </defs>

        <g id="connectionLayer"></g>
        <g id="dragConnectionLayer"></g>

      </svg>

      <div
        id="nodesLayer"
        class="nodes-layer"
      ></div>

    </div>

  </div>

  <div
    class="zoom-indicator"
    id="zoomIndicator"
  >
    100%
  </div>

  <div class="top-controls">

    <button
      id="themeButton"
      class="top-button theme-button"
      aria-label="다크 모드"
      type="button"
    >
      ◐
    </button>

    <button
      id="addButton"
      class="top-button add-button"
      aria-label="노드 추가"
      aria-expanded="false"
      type="button"
    >

      <svg

function portPoint(id,dir){

    getNodeElement(id);

        dir==='output'
          ?el.offsetWidth
          :0
      ),

    y:
      n.y+
      el.offsetHeight/2

  };

}

function curve(a,b){

  const dx=
    b.x-a.x;

  const bend=
    clamp(
      Math.abs(dx)*.22+
      Math.abs(b.y-a.y)*.05,
      28,
      85
    );

  return`
    M ${a.x} ${a.y}
    C
    ${a.x+bend} ${a.y},
    ${b.x-bend} ${b.y},
    ${b.x} ${b.y}
  `;

}

function svgEl(name,attrs={}){

  const e=
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      name
    );

  for(
    const[k,v]
    of Object.entries(attrs)
  ){

    e.setAttribute(k,v);

  }

  return e;

}

/* =========================
   NODE EXPANSION
========================= */

function setNodeExpanded(
  el,
  expanded,
  immediate=false
){

  if(!el)
    return;

  const body=
    el.querySelector(
      '.node-body'
    );

  const head=
    el.querySelector(
      '.node-head'
    );

  const toggle=
    el.querySelector(
      '.node-toggle'
    );

  const n=
    getNode(
      el.dataset.id
    );

  if(!body||!head||!n)
    return;

  n.expanded=expanded;

  el.classList.toggle(
    'expanded',
    expanded
  );

  toggle?.setAttribute(
    'aria-expanded',
    String(expanded)
  );

  toggle?.setAttribute(
    'aria-label',
    expanded
      ?'상세 내용 닫기'
      :'상세 내용 열기'
  );

  const collapsedHeight=
    head.offsetHeight+
    20;

  if(immediate){

    body.style.transition='none';
    el.style.transition='none';

    if(expanded){

      const target=
        body.scrollHeight;

      body.style.height=
        target+'px';

      el.style.height=
        (
          collapsedHeight+
          target
        )+'px';

    }else{

      body.style.height=
        '0px';

      el.style.height=
        collapsedHeight+'px';

    }

    requestAnimationFrame(()=>{

      el.style.transition='';
      body.style.transition='';

    });

    return;

  }

  const currentHeight=
    el.getBoundingClientRect()
      .height;

  const targetBodyHeight=
    expanded
      ?body.scrollHeight
      :0;

  const targetHeight=
    expanded
      ?collapsedHeight+
       targetBodyHeight
      :collapsedHeight;

  el.style.height=
    currentHeight+'px';

  body.style.height=
    expanded
      ?'0px'
      :body.scrollHeight+'px';

  void el.offsetHeight;

  requestAnimationFrame(()=>{

    el.style.height=
      targetHeight+'px';

    body.style.height=
      targetBodyHeight+'px';

    trackExpansion();

  });

}

function trackExpansion(){

  if(expansionAnimation){

    cancelAnimationFrame(
      expansionAnimation
    );

  }

  const started=
    performance.now();

  const duration=340;

  const tick=now=>{

    renderConnections();

    if(
      now-started<
      duration
    ){

      expansionAnimation=
        requestAnimationFrame(
          tick
        );

    }else{

      expansionAnimation=null;

      renderConnections();

    }

  };

  expansionAnimation=
    requestAnimationFrame(
      tick
    );

}

function deleteNode(id){

  if(!node||node.type==='start')
    return;

  const index=
    nodes.findIndex(

  if(

  connections=

        c.to!==id

    1

  if(
    selectedNodeId===id

    selectedNodeId=null;

  renderNodes();

  requestAnimationFrame(
    renderConnections

  updateComposerState();

function setNodePosition(

function findNewNodePosition(){

  const rect=
    canvas.getBoundingClientRect();

  const mobile=
    window.innerWidth<=600;

  const nodeWidth=
    mobile
      ?178
      :190;

  const nodeHeight=50;

  const marginScreen=
    28;

  const leftWorld=
    (
      marginScreen-
      offsetX
    )/scale;

  const topWorld=
    (
      marginScreen-
      offsetY
    )/scale;

  const rightWorld=
    (
      rect.width-
      marginScreen-
      nodeWidth*scale-
      offsetX
    )/scale;

  const bottomWorld=
    (
      rect.height-
      115-
      nodeHeight*scale-
      offsetY
    )/scale;

  const minX=
    Math.min(
      leftWorld,
      rightWorld
    );

  const maxX=
    Math.max(
      leftWorld,
      rightWorld
    );

  const minY=
    Math.min(
      topWorld,
      bottomWorld
    );

  const maxY=
    Math.max(
      topWorld,
      bottomWorld
    );

  const centerX=
    (minX+maxX)/2;

  const centerY=
    (minY+maxY)/2;

  const gap=24;

  const spots=[

    {
      x:centerX-nodeWidth/2,
      y:centerY-nodeHeight/2
    },

    {
      x:centerX-nodeWidth/2,
      y:centerY-nodeHeight/2+nodeHeight+gap
    },

    {
      x:centerX-nodeWidth/2,
      y:centerY-nodeHeight/2-nodeHeight-gap
    },

    {
      x:centerX-nodeWidth/2-nodeWidth-gap,
      y:centerY-nodeHeight/2
    },

    {
      x:centerX-nodeWidth/2+nodeWidth+gap,
      y:centerY-nodeHeight/2
    },

    {
      x:minX,
      y:minY
    }

  ];

  const valid=
    spots.find(
      p=>{

        if(
          p.x<minX||
          p.x>maxX||
          p.y<minY||
          p.y>maxY
        )
          return false;

        return !nodes.some(
          n=>{

            const horizontal=
              Math.abs(
                n.x-p.x
              )<
              nodeWidth+gap;

            const vertical=
              Math.abs(
                n.y-p.y
              )<
              nodeHeight+gap;

            return horizontal&&vertical;

          }
        );

      }
    );

  if(valid)
    return valid;

  return{

    x:
      clamp(
        centerX-nodeWidth/2,
        minX,
        maxX
      ),

    y:
      clamp(
        centerY-nodeHeight/2,
        minY,
        maxY
      )

  };

}

      closeAddMenu();

      return;

    }

  }

  const p=

  const node={

    id:
      'n'+
      Date.now()+
      Math.random()
        .toString(36)
        .slice(2,6),

    type,

    x:p.x,
    y:p.y,

    expanded:false

  };

  nodes.push(node);

  selectedNodeId=
    node.id;

  renderNodes();

  closeAddMenu();

  requestAnimationFrame(()=>{

    document
      .querySelectorAll('.node')
      .forEach(
        el=>{
          el.classList.toggle(
            'selected',
            el.dataset.id===node.id
          );
        }
      );

    renderConnections();

    updateComposerState();

  });

}

/* =========================
   ADD MENU
========================= */

function renderMenu(){

  addMenu.innerHTML='';

  for(
    const[k,t]
    of Object.entries(nodeTypes)
  ){

    const b=
      document.createElement(
        'button'
      );

    b.type='button';

    b.className=
      'menu-item';

    b.dataset.type=k;

    b.innerHTML=`

      <span class="menu-icon">
        ${iconSvg[k]||''}
      </span>

      <span class="menu-name">
        ${t.name}
      </span>

      <span class="menu-desc">
        ${t.tag}
      </span>

    `;

    b.addEventListener(
      'click',
      e=>{

        e.preventDefault();
        e.stopPropagation();

        addNode(k);

      }
    );

    addMenu.appendChild(b);

  }

}

function openAddMenu(){

  addMenu.classList.add(
    'open'
  );

  addButton.classList.add(
    'open'
  );

  addButton.setAttribute(
    'aria-expanded',
    'true'
  );

}

function closeAddMenu(){

  addMenu.classList.remove(
    'open'
  );

  addButton.classList.remove(
    'open'
  );

  addButton.setAttribute(
    'aria-expanded',
    'false'
  );

}

function toggleAddMenu(){

  addMenu.classList.contains(
    'open'
  )
    ?closeAddMenu()
    :openAddMenu();

}

renderMenu();

addButton.addEventListener(
  'click',
  e=>{

    e.preventDefault();
    e.stopPropagation();

    toggleAddMenu();

  }
);

/* =========================
   NODE EVENTS
========================= */

nodesLayer.addEventListener(
  'pointerdown',
  e=>{

    const expandedDelete=
      e.target.closest(
        '.node-delete-button'
      );

    if(expandedDelete){

      e.preventDefault();
      e.stopPropagation();

      const node=
        expandedDelete.closest(
          '.node'
        );

      if(node){

        deleteNode(
          node.dataset.id
        );

      }

      return;

    }

    const deleteButton=
      e.target.closest(
        '.node-delete'
      );

    if(deleteButton){

      e.preventDefault();
      e.stopPropagation();

      const node=
        deleteButton.closest(
          '.node'
        );

      if(node){

        deleteNode(
          node.dataset.id
        );

      }

      return;

    }

    const toggle=
      e.target.closest(
        '.node-toggle'
      );

    if(toggle){

      e.preventDefault();
      e.stopPropagation();

      const node=
        toggle.closest(
          '.node'
        );

      if(node){

        toggleNodeExpanded(
          node.dataset.id
        );

      }

      return;

    }

  }
);

/* =========================
   THEME
========================= */

function setTheme(theme){

  document.documentElement
    .classList
    .toggle(
      'dark',
      theme==='dark'
    );

  localStorage.setItem(
    'visual-ai-theme',
    theme
  );

}

setTheme(
  localStorage.getItem(
    'visual-ai-theme'
  )||'light'
);

themeButton.addEventListener(
  'click',
  e=>{

    e.stopPropagation();

    setTheme(
      document.documentElement
        .classList
        .contains('dark')
        ?'light'
        :'dark'
    );

  }
);

/* =========================
   CANVAS / GESTURES
========================= */

canvas.addEventListener(
  'pointerdown',
  e=>{

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if(pointers.size>=2){

      if(nodeDrag){

        finishNodeDrag();

      }

      canvasPan=null;
      connectionDrag=null;

      const ps=[
        ...pointers.values()
      ];

      const c=
        midpoint(
          ps[0],
          ps[1]
        );

      const anchor=
        screenToWorld(
          c.x,
          c.y
        );

      pinch={

        d:
          Math.max(
            1,
            distance(
              ps[0],
              ps[1]
            )
          ),

        s:scale,

        x:anchor.x,
        y:anchor.y

      };

      dragConnectionLayer.innerHTML='';

      return;

    }

    const port=
      e.target.closest(
        '.port-hit'
      );

    if(port){

      e.preventDefault();
      e.stopPropagation();

      const nodeEl=
        port.closest(
          '.node'
        );

      const n=
        nodeEl&&
        getNode(
          nodeEl.dataset.id
        );

      if(!n)
        return;

      if(
        port.dataset.port===
        'output'
      ){

        connectionDrag={

          pointerId:e.pointerId,

          from:n.id,

          x:e.clientX,
          y:e.clientY

        };

        try{

          canvas.setPointerCapture(
            e.pointerId
          );

        }catch{}

        renderDragConnection();

      }

      return;

    }

    const nodeEl=
      e.target.closest(
        '.node'
      );

    if(nodeEl){

      e.preventDefault();
      e.stopPropagation();

      const n=
        getNode(
          nodeEl.dataset.id
        );

      if(!n)
        return;

      selectNode(n.id);

      nodeDrag={

        pointerId:e.pointerId,

        node:n,

        startX:e.clientX,
        startY:e.clientY,

        nodeX:n.x,
        nodeY:n.y,

        moved:false,

        wasExpanded:
          !!n.expanded

      };

      try{

        canvas.setPointerCapture(
          e.pointerId
        );

      }catch{}

      return;

    }

    selectNode(null);

    canvasPan={

      pointerId:e.pointerId,

      startX:e.clientX,
      startY:e.clientY,

      startOffsetX:offsetX,
      startOffsetY:offsetY,

      moved:false

    };

    canvas.classList.add(
      'dragging'
    );

    try{

      canvas.setPointerCapture(
        e.pointerId
      );

    }catch{}

  }
);

/* =========================
   NODE DRAG
========================= */

function startNodeDrag(){

  if(!nodeDrag)
    return;

  const el=
    getNodeElement(
      nodeDrag.node.id
    );

  if(!el)
    return;

  if(nodeDrag.moved)
    return;

  nodeDrag.moved=true;

  nodeDrag.wasExpanded=
    !!nodeDrag.node.expanded;

  if(nodeDrag.wasExpanded){

    setNodeExpanded(
      el,
      false
    );

  }

  el.classList.add(
    'dragging'
  );

}

function finishNodeDrag(){

  if(!nodeDrag)
    return;

  const drag=
    nodeDrag;

  const el=
    getNodeElement(
      drag.node.id
    );

  if(el){

    el.classList.remove(
      'dragging'
    );

  }

  if(el){

    setNodeExpanded(
      el,
      !!drag.wasExpanded
    );

  }

  nodeDrag=null;

  renderConnections();

}

canvas.addEventListener(
  'pointermove',
  e=>{

    if(
      !pointers.has(
        e.pointerId
      )
    )
      return;

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if(
      pointers.size>=2
    ){

      if(nodeDrag){

        finishNodeDrag();

      }

      nodeDrag=null;
      canvasPan=null;

      const ps=[
        ...pointers.values()
      ];

      if(!pinch){

        const c=
          midpoint(
            ps[0],
            ps[1]
          );

        const anchor=
          screenToWorld(
            c.x,
            c.y
          );

        pinch={

          d:
            Math.max(
              1,
              distance(
                ps[0],
                ps[1]
              )
            ),

          s:scale,

          x:anchor.x,
          y:anchor.y

        };

      }

      const d=
        distance(
          ps[0],
          ps[1]
        );

      scale=
        clamp(
          pinch.s*
          (d/pinch.d),
          MIN_SCALE,
          MAX_SCALE
        );

      const c=
        midpoint(
          ps[0],
          ps[1]
        );

      offsetX=
        c.x-
        pinch.x*
        scale;

      offsetY=
        c.y-
        pinch.y*
        scale;

      renderTransform();
      renderConnections();

      return;

    }

    if(
      connectionDrag?.pointerId===
      e.pointerId
    ){

      e.preventDefault();

      connectionDrag.x=
        e.clientX;

      connectionDrag.y=
        e.clientY;

      renderDragConnection();

      return;

    }

    if(
      nodeDrag?.pointerId===
      e.pointerId
    ){

      const dx=
        e.clientX-
        nodeDrag.startX;

      const dy=
        e.clientY-
        nodeDrag.startY;

      if(
        !nodeDrag.moved&&
        Math.hypot(dx,dy)>7
      ){

        startNodeDrag();

      }

      if(!nodeDrag.moved)
        return;

      e.preventDefault();

      setNodePosition(

        nodeDrag.node,

        nodeDrag.nodeX+
          dx/scale,

        nodeDrag.nodeY+
          dy/scale

      );

      return;

    }

    if(
      canvasPan?.pointerId===
      e.pointerId
    ){

      const dx=
        e.clientX-
        canvasPan.startX;

      const dy=
        e.clientY-
        canvasPan.startY;

      if(
        !canvasPan.moved&&
        Math.hypot(dx,dy)>7
      ){

        canvasPan.moved=true;

      }

      if(!canvasPan.moved)
        return;

      e.preventDefault();

      offsetX=
        canvasPan.startOffsetX+
        dx;

      offsetY=
        canvasPan.startOffsetY+
        dy;

      renderTransform();
      renderConnections();

    }

  },
  {
    passive:false
  }
);

/* =========================
   CONNECTION
========================= */

function finishConnection(e){

  dragConnectionLayer.innerHTML='';

  if(!connectionDrag)
    return;

  const source=
    connectionDrag.from;

  const target=
    document
      .elementFromPoint(
        e.clientX,
        e.clientY
      )
      ?.closest(
        '.port-hit.input'
      );

  const targetNode=
    target?.closest(
      '.node'
    );

  const to=
    targetNode?.dataset.id;

  if(
    to&&
    to!==source
  ){

    const existingIndex=
      connections.findIndex(
        c=>
          c.from===source&&
          c.to===to
      );

    if(existingIndex!==-1){

      connections.splice(
        existingIndex,
        1
      );

    }else{

      connections.push({

        from:source,
        to

      });

    }

  }

  connectionDrag=null;

  renderNodes();

  requestAnimationFrame(
    renderConnections
  );

}

function endPointer(e){

  if(
    connectionDrag?.pointerId===
    e.pointerId
  ){

    finishConnection(e);

  }

  pointers.delete(
    e.pointerId
  );

  if(
    pointers.size<2
  ){

    pinch=null;

  }

  if(
    pointers.size===0
  ){

    if(nodeDrag){

      finishNodeDrag();

    }

    canvasPan=null;
    connectionDrag=null;

    canvas.classList.remove(
      'dragging'
    );

    dragConnectionLayer.innerHTML='';

  }

}

canvas.addEventListener(
  'pointerup',
  endPointer
);

canvas.addEventListener(
  'pointercancel',
  endPointer
);

/* =========================
   DRAG CONNECTION
========================= */

function renderDragConnection(){

  dragConnectionLayer.innerHTML='';

  if(!connectionDrag)
    return;

  const a=
    portPoint(
      connectionDrag.from,
      'output'
    );

  if(!a)
    return;

  const b=
    screenToWorld(
      connectionDrag.x,
      connectionDrag.y
    );

  const p=
    svgEl(
      'path',
      {
        d:curve(a,b),
        'marker-end':
          'url(#arrow)'
      }
    );

  p.classList.add(
    'drag-connection'
  );

  dragConnectionLayer.appendChild(p);

  dragConnectionLayer.appendChild(

    svgEl(
      'circle',
      {
        cx:a.x,
        cy:a.y,
        r:4,
        class:'drag-source-dot'
      }
    )

  );

}

/* =========================
   WHEEL ZOOM
========================= */

canvas.addEventListener(
  'wheel',
  e=>{

    e.preventDefault();

    const before=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    const factor=
      Math.exp(
        -e.deltaY*.0015
      );

    scale=
      clamp(
        scale*factor,
        MIN_SCALE,
        MAX_SCALE
      );

    offsetX=
      e.clientX-
      before.x*
      scale;

    offsetY=
      e.clientY-
      before.y*
      scale;

    renderTransform();
    renderConnections();

  },
  {
    passive:false
  }
);

/* =========================
   COMPOSER
========================= */

function updateComposerState(){

  const hasText=
    chatInput.value
      .trim()
      .length>0;

  const active=
    hasText||
    selectedNodeId!==null;

  chatForm.classList.toggle(
    'has-text',
    hasText
  );

  chatForm.classList.toggle(
    'is-active',
    active
  );

  chatInput.style.height=
    'auto';

  chatInput.style.height=
    Math.min(
      chatInput.scrollHeight,
      115
    )+'px';

}

chatInput.addEventListener(
  'input',
  updateComposerState
);

chatInput.addEventListener(
  'focus',
  updateComposerState
);

chatInput.addEventListener(
  'keydown',
  e=>{

    if(
      e.key==='Enter'&&
      !e.shiftKey
    ){

      e.preventDefault();

      chatForm.requestSubmit();

    }

  }
);

chatForm.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    if(
      !chatInput.value.trim()
    )
      return;

    chatInput.value='';

    updateComposerState();

    chatInput.focus();

  }
);

document
  .getElementById(
    'attachButton'
  )
  .addEventListener(
    'click',
    e=>{
      e.stopPropagation();
    }
  );

/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
  'pointerdown',
  e=>{

    if(
      !addMenu.contains(e.target)&&
      !addButton.contains(e.target)
    ){

      closeAddMenu();

    }

  }
);

document
  .querySelector(
    '.chat-composer-wrap'
  )
  .addEventListener(
    'pointerdown',
    e=>{
      e.stopPropagation();
    }
  );

document
  .querySelector(
    '.top-controls'
  )
  .addEventListener(
    'pointerdown',
    e=>{
      e.stopPropagation();
    }
  );

addMenu.addEventListener(
  'pointerdown',
  e=>{
    e.stopPropagation();
  }
);

/* =========================
   RESIZE
========================= */

resizeObserver.observe(
  nodesLayer
);

/* =========================
   INITIAL
========================= */

function centerInitial(){

  const r=
    canvas.getBoundingClientRect();

  const n=
    nodes[0];

  const w=
    window.innerWidth<=600
      ?178
      :190;

  offsetX=
    r.width/2-
    (
      n.x+
      w/2
    )*
    scale;

  offsetY=
    Math.max(
      90,
      r.height*.12
    )-
    n.y*
    scale;

}

function render(){

  renderTransform();

  renderNodes();

  renderConnections();

}

centerInitial();

render();

updateComposerState();

</script>

</body>
</html>
