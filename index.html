      listen(
        root,
        'pointerdown',
        event=>{

          if(
            !addMenu.contains(
              event.target
            )&&
            !addButton.contains(
              event.target
            )
          ){

            closeAddMenu();

          }

        }
      );


      listen(
        themeButton,
        'click',
        event=>{

          event.stopPropagation();


          setTheme(
            document.documentElement.classList.contains(
              'dark'
            )
              ?'light'
              :'dark'
          );

        }
      );


      listen(
        attachButton,
        'click',
        event=>{

          event.stopPropagation();

          fileInput.click();

        }
      );


      listen(
        fileInput,
        'change',
        event=>{

          const files=[
            ...event.target.files
          ];


          if(!files.length){

            return;

          }


          const rect=
            canvas.getBoundingClientRect();


          const base=
            screenToWorld(
              rect.left+
                rect.width/2,

              rect.top+
                Math.min(
                  rect.height/2,
                  rect.height-180
                )
            );


          files.forEach(
            (file,index)=>{

              const previewUrl=
                file.type.startsWith(
                  'image/'
                )
                  ?URL.createObjectURL(
                    file
                  )
                  :null;


              addNode(
                'file',
                {

                  x:
                    base.x+
                    (
                      index-
                      (
                        files.length-1
                      )/2
                    )*
                    220,

                  y:
                    base.y,

                  data:{

                    file,

                    name:
                      file.name,

                    mime:
                      file.type||
                      'application/octet-stream',

                    size:
                      file.size,

                    lastModified:
                      file.lastModified,

                    previewUrl

                  }

                }
              );

            }
          );


          fileInput.value='';


          emit(
            'attach',
            {
              files
            }
          );

        }
      );


      listen(
        chatInput,
        'input',
        updateComposerState
      );


      listen(
        chatInput,
        'focus',
        updateComposerState
      );


      listen(
        chatInput,
        'keydown',
        event=>{

          if(state.aiBusy){

            return;

          }


          if(
            event.key==='Enter'&&
            !event.shiftKey
          ){

            event.preventDefault();

            chatForm.requestSubmit();

          }

        }
      );


      listen(
        chatForm,
        'submit',
        event=>{

          event.preventDefault();


          if(
            state.aiBusy
          ){

            return;

          }


          const text=
            chatInput.value.trim();


          if(!text){

            return;

          }


          state.aiBusy=
            true;


          updateComposerState();


          emit(
            'submit',
            {

              text,

              selectedNode:
                state.selectedNode

            }
          );

        }
      );


      listen(
        nodesLayer,
        'pointerdown',
        event=>{

          const action=
            event.target.closest(
              '[data-action]'
            );


          if(!action){

            return;

          }


          event.stopPropagation();

        }
      );


      listen(
        nodesLayer,
        'click',
        event=>{

          const action=
            event.target.closest(
              '[data-action]'
            );


          if(!action){

            return;

          }


          event.preventDefault();

          event.stopPropagation();


          const nodeElement=
            action.closest(
              '.vc-node'
            );


          if(!nodeElement){

            return;

          }


          if(
            action.dataset.action===
            'toggle'
          ){

            toggleNodeExpanded(
              nodeElement.dataset.nodeId
            );

            return;

          }


          if(
            action.dataset.action===
              'delete'||
            action.dataset.action===
              'delete-expanded'
          ){

            removeNode(
              nodeElement.dataset.nodeId
            );

          }

        }
      );


      /* =========================
         Canvas Pointer Events
      ========================= */

      listen(
        canvas,
        'pointerdown',
        event=>{

          state.pointers.set(
            event.pointerId,
            {
              x:event.clientX,
              y:event.clientY
            }
          );


          if(
            state.pointers.size>=2
          ){

            if(
              state.nodeDrag
            ){

              finishNodeDrag();

            }


            state.canvasPan=
              null;

            state.connectionDrag=
              null;


            const points=
              [
                ...state.pointers.values()
              ];


            const center=
              midpoint(
                points[0],
                points[1]
              );


            const anchor=
              screenToWorld(
                center.x,
                center.y
              );


            state.pinch={

              d:
                Math.max(
                  1,
                  distance(
                    points[0],
                    points[1]
                  )
                ),

              s:
                state.scale,

              x:
                anchor.x,

              y:
                anchor.y

            };


            dragConnectionLayer.textContent='';

            return;

          }


          const port=
            event.target.closest(
              '.vc-port-hit'
            );


          if(port){

            event.preventDefault();

            event.stopPropagation();


            const nodeId=
              port.dataset.nodeId;


            const node=
              getNode(
                nodeId
              );


            if(!node){

              return;

            }


            if(
              port.dataset.portDir===
              'output'
            ){

              state.connectionDrag={

                pointerId:
                  event.pointerId,

                from:{

                  node:
                    node.id,

                  port:
                    port.dataset.portId

                },

                x:
                  event.clientX,

                y:
                  event.clientY

              };


              try{

                canvas.setPointerCapture(
                  event.pointerId
                );

              }catch{}


              renderDragConnection();

            }


            return;

          }


          const nodeElement=
            event.target.closest(
              '.vc-node'
            );


          if(nodeElement){

            event.preventDefault();

            event.stopPropagation();


            const node=
              getNode(
                nodeElement.dataset.nodeId
              );


            if(!node){

              return;

            }


            selectNode(
              node.id
            );


            state.nodeDrag={

              pointerId:
                event.pointerId,

              node,

              startX:
                event.clientX,

              startY:
                event.clientY,

              nodeX:
                node.x,

              nodeY:
                node.y,

              moved:
                false,

              wasExpanded:
                !!node.expanded

            };


            try{

              canvas.setPointerCapture(
                event.pointerId
              );

            }catch{}


            return;

          }


          selectNode(
            null
          );


          state.canvasPan={

            pointerId:
              event.pointerId,

            startX:
              event.clientX,

            startY:
              event.clientY,

            startOffsetX:
              state.offset.x,

            startOffsetY:
              state.offset.y,

            moved:
              false

          };


          canvas.classList.add(
            'vc-dragging'
          );


          try{

            canvas.setPointerCapture(
              event.pointerId
            );

          }catch{}

        }
      );


      listen(
        canvas,
        'pointermove',
        event=>{

          if(
            !state.pointers.has(
              event.pointerId
            )
          ){

            return;

          }


          state.pointers.set(
            event.pointerId,
            {
              x:event.clientX,
              y:event.clientY
            }
          );


          if(
            state.pointers.size>=2
          ){

            if(
              state.nodeDrag
            ){

              finishNodeDrag();

              state.nodeDrag=
                null;

            }


            state.canvasPan=
              null;


            const points=[
              ...state.pointers.values()
            ];


            if(!state.pinch){

              const center=
                midpoint(
                  points[0],
                  points[1]
                );


              const anchor=
                screenToWorld(
                  center.x,
                  center.y
                );


              state.pinch={

                d:
                  Math.max(
                    1,
                    distance(
                      points[0],
                      points[1]
                    )
                  ),

                s:
                  state.scale,

                x:
                  anchor.x,

                y:
                  anchor.y

              };

            }


            const d=
              distance(
                points[0],
                points[1]
              );


            const center=
              midpoint(
                points[0],
                points[1]
              );


            state.scale=
              clamp(
                state.pinch.s*
                (
                  d/
                  state.pinch.d
                ),
                .12,
                3
              );


            state.offset.x=
              center.x-
              state.pinch.x*
              state.scale;


            state.offset.y=
              center.y-
              state.pinch.y*
              state.scale;


            renderTransform();

            renderConnections();

            return;

          }


          if(
            state.connectionDrag?.pointerId===
            event.pointerId
          ){

            event.preventDefault();


            state.connectionDrag.x=
              event.clientX;


            state.connectionDrag.y=
              event.clientY;


            renderDragConnection();

            return;

          }


          if(
            state.nodeDrag?.pointerId===
            event.pointerId
          ){

            const drag=
              state.nodeDrag;


            const dx=
              event.clientX-
              drag.startX;


            const dy=
              event.clientY-
              drag.startY;


            if(
              !drag.moved&&
              Math.hypot(
                dx,
                dy
              )>7
            ){

              startNodeDrag();

            }


            if(
              !drag.moved
            ){

              return;

            }


            event.preventDefault();


            setNodePosition(
              drag.node,
              drag.nodeX+
                dx/
                state.scale,
              drag.nodeY+
                dy/
                state.scale
            );


            return;

          }


          if(
            state.canvasPan?.pointerId===
            event.pointerId
          ){

            const pan=
              state.canvasPan;


            const dx=
              event.clientX-
              pan.startX;


            const dy=
              event.clientY-
              pan.startY;


            if(
              !pan.moved&&
              Math.hypot(
                dx,
                dy
              )>7
            ){

              pan.moved=
                true;

            }


            if(
              !pan.moved
            ){

              return;

            }


            event.preventDefault();


            state.offset.x=
              pan.startOffsetX+
              dx;


            state.offset.y=
              pan.startOffsetY+
              dy;


            renderTransform();

            renderConnections();

          }

        },
        {
          passive:false
        }
      );


      function endPointer(
        event
      ){

        if(
          state.connectionDrag?.pointerId===
          event.pointerId
        ){

          finishConnection(
            event
          );

        }


        if(
          state.nodeDrag?.pointerId===
          event.pointerId
        ){

          finishNodeDrag();

        }


        state.pointers.delete(
          event.pointerId
        );


        if(
          state.pointers.size<2
        ){

          state.pinch=
            null;

        }


        if(
          state.pointers.size===0
        ){

          state.canvasPan=
            null;

          state.connectionDrag=
            null;

          canvas.classList.remove(
            'vc-dragging'
          );

          dragConnectionLayer.textContent='';

        }

      }


      listen(
        canvas,
        'pointerup',
        endPointer
      );


      listen(
        canvas,
        'pointercancel',
        endPointer
      );


      listen(
        canvas,
        'wheel',
        event=>{

          event.preventDefault();


          const before=
            screenToWorld(
              event.clientX,
              event.clientY
            );


          const factor=
            Math.exp(
              -event.deltaY*
              .0015
            );


          state.scale=
            clamp(
              state.scale*
              factor,
              .12,
              3
            );


          state.offset.x=
            event.clientX-
            before.x*
            state.scale;


          state.offset.y=
            event.clientY-
            before.y*
            state.scale;


          renderTransform();

          renderConnections();

        },
        {
          passive:false
        }
      );


      /* =========================
         Resize
      ========================= */

      const resizeObserver=
        new ResizeObserver(
          ()=>{
            renderConnections();

            emit(
              'resize',
              canvas.getBoundingClientRect()
            );
          }
        );


      resizeObserver.observe(
        canvas
      );


      observerHandles.push(
        ()=>{
          resizeObserver.disconnect();
        }
      );


      observerHandles.push(
        ()=>{
          nodeResizeObserver.disconnect();
        }
      );


      function centerInitial(){

        if(
          !state.nodes.length
        ){

          return;

        }


        const rect=
          canvas.getBoundingClientRect();


        const firstNode=
          state.nodes[0];


        const width=
          window.innerWidth<=600
            ?178
            :190;


        state.offset.x=
          rect.width/2-
          (
            firstNode.x+
            width/2
          )*
          state.scale;


        state.offset.y=
          Math.max(
            90,
            rect.height*.12
          )-
          firstNode.y*
          state.scale;

      }


      /* =========================
         Definition Registration
      ========================= */

      function registerNodeType(
        type,
        definition
      ){

        if(
          !type||
          typeof type!=='string'
        ){

          throw new TypeError(
            'type must be a string'
          );

        }


        registry.set(
          type,
          normalizeNodeType(
            type,
            definition
          )
        );


        renderMenu();

        render();


        return api;

      }


      function unregisterNodeType(
        type
      ){

        if(
          type==='start'
        ){

          throw new Error(
            'start node type cannot be removed'
          );

        }


        registry.delete(
          type
        );


        renderMenu();

        return api;

      }


      /* =========================
         API
      ========================= */

      const api={

        root,

        registerNodeType,

        unregisterNodeType,

        addNode,

        removeNode,

        connect,

        disconnect,

        canConnect,

        validate,

        getWorkflow,

        getState,

        setState,

        getNode:
          id=>
            getNode(id),

        on,

        off,

        selectNode,

        render,

        __setAIWaiting(
          busy
        ){

          state.aiBusy=
            !!busy;


          const sendButton=
            qs(
              '.vc-send-button'
            );


          const attach=
            qs(
              '.vc-attach-button'
            );


          if(
            state.aiBusy
          ){

            sendButton.innerHTML=`
              <span
                class="vc-ai-spinner"
                aria-hidden="true"
              ></span>
            `;


            sendButton.setAttribute(
              'aria-label',
              '작업 생성 중'
            );


            attach.setAttribute(
              'aria-disabled',
              'true'
            );

          }else{

            sendButton.innerHTML=
              sendIcon;


            sendButton.setAttribute(
              'aria-label',
              '보내기'
            );


            attach.removeAttribute(
              'aria-disabled'
            );

          }


          updateComposerState();

        },


        destroy(){

          if(
            state.destroyed
          ){

            return;

          }


          state.destroyed=
            true;


          listeners
            .splice(0)
            .forEach(
              cleanup=>{
                try{
                  cleanup();
                }catch{}
              }
            );


          observerHandles
            .splice(0)
            .forEach(
              cleanup=>{
                try{
                  cleanup();
                }catch{}
              }
            );


          if(
            state.expansionAnimation
          ){

            cancelAnimationFrame(
              state.expansionAnimation
            );

          }


          state.rafIds.forEach(
            cancelAnimationFrame
          );


          state.rafIds.clear();


          if(
            state.validationTimer
          ){

            clearTimeout(
              state.validationTimer
            );

          }


          events.clear();


          state.pointers.clear();

          state.nodeDrag=
            null;

          state.canvasPan=
            null;

          state.connectionDrag=
            null;


          root.remove();

        }

      };


      /* =========================
         Initial Workflow
      ========================= */

      const initial={

        nodes:[
          {
            id:'start',
            type:'start',
            x:780,
            y:80,
            expanded:true
          }
        ],

        connections:[]

      };


      /*
        Definition은 이미 loadNodeDefinitions()
        결과를 받아서 생성됐으므로
        start도 즉시 정상 렌더링된다.
      */
      renderMenu();

      applySavedTheme();

      setState({
        workflow:initial
      });

      centerInitial();

      render();


      if(
        options.onChange
      ){

        on(
          'change',
          options.onChange
        );

      }


      if(
        options.onConnect
      ){

        on(
          'connect',
          options.onConnect
        );

      }


      if(
        options.onValidate
      ){

        on(
          'validate',
          options.onValidate
        );

      }


      if(
        options.onSubmit
      ){

        on(
          'submit',
          options.onSubmit
        );

      }


      if(
        options.onAttach
      ){

        on(
          'attach',
          options.onAttach
        );

      }


      if(
        options.onResize
      ){

        on(
          'resize',
          options.onResize
        );

      }


      return api;

    };


  /* =========================
     Workflow Animation
  ========================= */

  function chatApplyResult(
    canvas,
    text
  ){

    const root=
      canvas.root;


    const input=
      root.querySelector(
        '.vc-chat-input'
      );


    if(input){

      input.value='';

    }


    canvas.render();


    requestAnimationFrame(
      ()=>{

        requestAnimationFrame(
          ()=>{

            const nodes=
              root.querySelectorAll(
                '.vc-node'
              );


            nodes.forEach(
              (element,index)=>{

                element.animate(

                  [

                    {
                      opacity:0,
                      filter:'blur(5px)'
                    },

                    {
                      opacity:1,
                      filter:'blur(0)'
                    }

                  ],

                  {

                    duration:400,

                    delay:
                      index*45,

                    easing:
                      'cubic-bezier(.22,1,.36,1)',

                    fill:'both'

                  }

                );

              }
            );

          }
        );

      }
    );

  }


  function chatApplyError(
    canvas,
    error
  ){

    const root=
      canvas.root;


    const input=
      root.querySelector(
        '.vc-chat-input'
      );


    const validation=
      root.querySelector(
        '.vc-validation'
      );


    if(input){

      input.value=
        input.value||
        '';

      input.focus();

    }


    if(validation){

      validation.textContent='';


      const item=
        document.createElement(
          'div'
        );


      item.className=
        'vc-validation-item vc-error vc-show';


      item.textContent=
        error?.message||
        '워크플로우 생성에 실패했습니다.';


      validation.appendChild(
        item
      );


      setTimeout(
        ()=>{

          item.classList.remove(
            'vc-show'
          );


          setTimeout(
            ()=>{
              item.remove();
            },
            220
          );

        },
        3000
      );

    }

  }


  /* =========================
     Canvas Boot
  ========================= */

  const app=
    document.getElementById(
      'app'
    );


  async function boot(){

    try{

      /*
        가장 먼저 Canonical Definition을
        서버에서 확보한다.
      */
      const nodeDefinitions=
        await loadNodeDefinitions();


      /*
        그 다음 canvas를 만든다.
      */
      const canvas=
        window.createVisualCanvas(
          app,
          {

            nodeDefinitions,

            onConnect(){},

            onValidate(){},

            onSubmit:
              async({text})=>{

                try{

                  const workflow=
                    await workflowToCanvas(
                      text,
                      canvas
                    );


                  const validation=
                    canvas.validate();


                  if(
                    !validation.valid
                  ){

                    throw new Error(
                      validation
                        .errors?.[0]
                        ?.message||
                      '생성된 워크플로우를 적용할 수 없습니다.'
                    );

                  }


                  chatApplyResult(
                    canvas,
                    text
                  );

                }catch(error){

                  console.error(
                    'Workflow ERROR:',
                    error
                  );


                  chatApplyError(
                    canvas,
                    error
                  );

                }finally{

                  canvas.__setAIWaiting?.(
                    false
                  );

                }

              },

            onAttach(){}

          }
        );


      window.visualCanvas=
        canvas;


    }catch(error){

      console.error(
        'Node Definition ERROR:',
        error
      );


      /*
        Definition을 못 받으면
        캔버스를 억지로 옛날 정의로 생성하지 않는다.
        서버 schema 단일화 원칙을 유지한다.
      */
      const message=
        document.createElement(
          'div'
        );


      message.style.cssText=`
        position:fixed;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        z-index:10000;
        max-width:calc(100vw - 32px);
        padding:16px 18px;
        border-radius:14px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(30,30,34,.88);
        color:#fff;
        font-size:12px;
        line-height:1.5;
        text-align:center;
        box-shadow:0 12px 40px rgba(0,0,0,.22);
      `;


      message.textContent=
        error?.message||
        '노드 정의를 불러오지 못했습니다.';


      document.body.appendChild(
        message
      );

    }

  }


  boot();


})();

      padding:10px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:11px;

      background:var(--soft);

      overflow:hidden;

    }


    .vc-tutorial-bottom{

      display:flex;

      align-items:center;

      justify-content:space-between;

      margin-top:14px;

    }


    .vc-tutorial-page{

      color:var(--faint);

      font-size:9px;

      font-variant-numeric:
        tabular-nums;

    }


    .vc-tutorial-buttons{

      display:flex;

      gap:5px;

    }


    .vc-tutorial-buttons button{

      height:30px;

      padding:0 10px;

      border:0;

      border-radius:9px;

      font-size:10px;

      cursor:pointer;

    }


    .vc-tutorial-skip{

      color:var(--sub);

      background:
        transparent;

    }


    .vc-tutorial-skip:hover{

      background:
        var(--soft);

    }


    .vc-tutorial-next{

      color:#fff;

      background:
        var(--accent);

      box-shadow:

        0 4px 12px
        color-mix(
          in srgb,
          var(--accent)
          25%,
          transparent
        );

    }


    .vt-flow{

      width:100%;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:7px;

    }


    .vt-mini-node{

      padding:6px 8px;

      border:
        1px solid
        var(--border);

      border-radius:8px;

      background:
        var(--node);

      font-size:9px;

      font-weight:650;

    }


    .vt-flow-arrow{

      color:var(--sub);

      font-size:11px;

    }


    .vt-green{
      color:#10B981;
    }

    .vt-blue{
      color:#3B82F6;
    }

    .vt-purple{
      color:#8B5CF6;
    }

    .vt-red{
      color:#EF4444;
    }


    .vt-connect-demo{

      display:flex;

      align-items:center;

      width:100%;

      justify-content:center;

    }


    .vt-port{

      width:10px;

      height:10px;

      flex:none;

      border-radius:50%;

      background:
        currentColor;

      box-shadow:

        0 0 0 4px
        color-mix(
          in srgb,
          currentColor
          15%,
          transparent
        );

    }


    .vt-connect-line{

      width:80px;

      height:2px;

      margin:0 8px;

      border-radius:999px;

      background:
        var(--line);

    }


    .vt-demo-node{

      width:135px;

      padding:9px;

      border:
        1px solid
        var(--border);

      border-radius:10px;

      background:
        var(--node);

      box-shadow:
        var(--shadow);

    }


    .vt-demo-head{

      width:45%;

      height:7px;

      margin-bottom:8px;

      border-radius:999px;

      background:
        var(--soft);

    }


    .vt-demo-input{

      height:14px;

      margin-top:5px;

      border:
        1px solid
        var(--border);

      border-radius:5px;

      background:
        var(--canvas);

    }


    .vt-demo-input.vt-small{

      width:65%;

    }


    .vt-chat-demo{

      width:100%;

      display:flex;

      flex-direction:column;

      gap:5px;

    }


    .vt-bubble{

      max-width:88%;

      padding:6px 9px;

      border-radius:9px;

      font-size:9px;

      line-height:1.4;

    }


    .vt-user{

      align-self:flex-end;

      background:
        var(--accent-soft);

    }


    .vt-ai{

      align-self:flex-start;

      border:
        1px solid
        var(--border);

      background:
        var(--node);

    }


    .vt-down{

      align-self:center;

      color:var(--faint);

      font-size:10px;

    }


    @media(max-width:600px){

      .vc-tutorial-card{

        width:
          calc(100vw - 28px);

      }

    }

  `;


  const layer=
    document.createElement(
      'div'
    );


  layer.className=
    'vc-tutorial';


  layer.innerHTML=`

    <div class="vc-tutorial-shade"></div>

    <div class="vc-tutorial-focus"></div>

    <div class="vc-tutorial-card">

      <div class="vc-tutorial-title"></div>

      <div class="vc-tutorial-desc"></div>

      <div class="vc-tutorial-visual"></div>

      <div class="vc-tutorial-bottom">

        <span class="vc-tutorial-page"></span>

        <div class="vc-tutorial-buttons">

          <button
            type="button"
            class="vc-tutorial-skip"
          >
            건너뛰기
          </button>

          <button
            type="button"
            class="vc-tutorial-next"
          >
            다음
          </button>

        </div>

      </div>

    </div>

  `;


  document.head.appendChild(
    style
  );


  document.body.appendChild(
    layer
  );


  const focus=
    layer.querySelector(
      '.vc-tutorial-focus'
    );


  const card=
    layer.querySelector(
      '.vc-tutorial-card'
    );


  const title=
    layer.querySelector(
      '.vc-tutorial-title'
    );


  const desc=
    layer.querySelector(
      '.vc-tutorial-desc'
    );


  const visual=
    layer.querySelector(
      '.vc-tutorial-visual'
    );


  const page=
    layer.querySelector(
      '.vc-tutorial-page'
    );


  const next=
    layer.querySelector(
      '.vc-tutorial-next'
    );


  const skip=
    layer.querySelector(
      '.vc-tutorial-skip'
    );


  let index=0;

  let running=true;

  let rafId=0;


  function stopPositionLoop(){

    if(!rafId){

      return;

    }


    cancelAnimationFrame(
      rafId
    );


    rafId=0;

  }


  function finish(){

    if(!running){

      return;

    }


    running=
      false;


    stopPositionLoop();


    window.removeEventListener(
      'resize',
      handleResize
    );


    localStorage.setItem(
      'vc-tutorial-done',
      '1'
    );


    layer.classList.remove(
      'open'
    );


    setTimeout(
      ()=>{
        layer.remove();
        style.remove();
      },
      220
    );

  }


  function getTarget(){

    const step=
      steps[index];


    return step
      ?document.querySelector(
        step.target
      )
      :null;

  }


  function updatePosition(){

    if(!running){

      return false;

    }


    const target=
      getTarget();


    if(!target){

      return false;

    }


    const rect=
      target.getBoundingClientRect();


    const pad=7;

    const gap=18;


    focus.style.left=
      `${rect.left-pad}px`;


    focus.style.top=
      `${rect.top-pad}px`;


    focus.style.width=
      `${rect.width+pad*2}px`;


    focus.style.height=
      `${rect.height+pad*2}px`;


    const cardWidth=
      card.offsetWidth;


    const cardHeight=
      card.offsetHeight;


    if(
      !cardWidth||
      !cardHeight
    ){

      return true;

    }


    let x=
      rect.left+
      (
        rect.width-
        cardWidth
      )/
      2;


    let y=
      rect.bottom+
      gap;


    if(
      y+cardHeight>
      window.innerHeight-14
    ){

      y=
        rect.top-
        cardHeight-
        gap;

    }


    const maxX=
      Math.max(
        14,
        window.innerWidth-
        cardWidth-
        14
      );


    const maxY=
      Math.max(
        14,
        window.innerHeight-
        cardHeight-
        14
      );


    x=
      Math.min(
        Math.max(
          x,
          14
        ),
        maxX
      );


    y=
      Math.min(
        Math.max(
          y,
          14
        ),
        maxY
      );


    card.style.left=
      `${x}px`;


    card.style.top=
      `${y}px`;


    return true;

  }


  function positionLoop(){

    if(!running){

      return;

    }


    const exists=
      updatePosition();


    if(!exists){

      finish();

      return;

    }


    rafId=
      requestAnimationFrame(
        positionLoop
      );

  }


  function restartPositionLoop(){

    stopPositionLoop();


    requestAnimationFrame(
      ()=>{

        if(!running){

          return;

        }


        updatePosition();

        positionLoop();

      }
    );

  }


  function renderStep(){

    if(!running){

      return;

    }


    const step=
      steps[index];


    if(!step){

      finish();

      return;

    }


    const target=
      document.querySelector(
        step.target
      );


    if(!target){

      if(
        index<
        steps.length-1
      ){

        index++;

        renderStep();

      }else{

        finish();

      }


      return;

    }


    title.textContent=
      step.title;


    desc.textContent=
      step.desc;


    visual.innerHTML=
      step.visual;


    page.textContent=
      `${index+1} / ${steps.length}`;


    next.textContent=
      index===
      steps.length-1
        ?'시작하기'
        :'다음';


    restartPositionLoop();

  }


  function handleResize(){

    if(!running){

      return;

    }


    requestAnimationFrame(
      ()=>{
        updatePosition();
      }
    );

  }


  next.addEventListener(
    'click',
    event=>{

      event.preventDefault();

      event.stopPropagation();


      if(!running){

        return;

      }


      if(
        index===
        steps.length-1
      ){

        finish();

        return;

      }


      index++;

      renderStep();

    }
  );


  skip.addEventListener(
    'click',
    event=>{

      event.preventDefault();

      event.stopPropagation();

      finish();

    }
  );


  layer.addEventListener(
    'click',
    event=>{
      event.stopPropagation();
    }
  );


  window.addEventListener(
    'resize',
    handleResize
  );


  layer.classList.add(
    'open'
  );


  requestAnimationFrame(
    ()=>{
      renderStep();
    }
  );

}


setTimeout(
  playTutorial,
  500
);
</script>

</body>
</html>
